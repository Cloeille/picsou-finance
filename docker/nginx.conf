# Only addresses written by the entrypoint are allowed to replace nginx's socket peer
# from X-Forwarded-For. The bundled Caddy gets one exact address on an isolated network;
# a direct client or an unlisted proxy therefore cannot spoof $remote_addr. The wildcard
# is intentional: the image build validates this config before the runtime snippet exists.
include /etc/nginx/snippets/picsou-trusted-proxy*.conf;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Preserve the public scheme and host values an upstream TLS terminator sent, falling
# back to nginx's own values when it is the edge. The backend honors these through
# Tomcat's loopback-only RemoteIpValve, so a same-origin HTTPS request remains same-origin.
# Host falls back to $http_host, which keeps the port the browser used (http://nas:8080):
# the backend's CSRF Origin check compares against it, and $host would drop the port.
# RemoteIpValve does not infer the port embedded in X-Forwarded-Host, so extract it first
# (including bracketed IPv6). Otherwise accept a numeric upstream X-Forwarded-Port; an
# empty value deliberately lets Tomcat select the scheme default (80 or 443).
map $http_x_forwarded_proto $picsou_xfp   { default $scheme;    ~.+ $http_x_forwarded_proto; }
map $http_x_forwarded_host  $picsou_xfh   { default $http_host; ~.+ $http_x_forwarded_host;  }
map $picsou_xfh $picsou_host_port {
    "~^\[[0-9A-Fa-f:.]+\]:(?<picsou_ipv6_port>[0-9]{1,5})$" $picsou_ipv6_port;
    "~^[^:]+:(?<picsou_named_port>[0-9]{1,5})$"             $picsou_named_port;
    default                                                    "";
}
map $http_x_forwarded_port $picsou_header_port {
    "~^[0-9]{1,5}$" $http_x_forwarded_port;
    default           "";
}
map $picsou_host_port $picsou_xfport {
    ~.+     $picsou_host_port;
    default $picsou_header_port;
}

server {
    listen 8080;
    server_name _;

    # Spring Boot serves everything: the SPA (index.html fallback, caching, compression), the API,
    # the OAuth2 endpoints and every response header, HSTS included. nginx only resolves the
    # client address and the public scheme/host/port, and sets the timeouts below.
    #
    # Each location repeats its proxy_set_header lines on purpose: nginx inherits them from the
    # enclosing level only when a location sets none of its own.
    #
    # Some sync flows (Enable Banking, Trade Republic) wait on third-party APIs. The backend
    # caps its own waits, but give nginx breathing room so a slightly slow upstream doesn't
    # surface as a blank 502 page.
    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $picsou_xfp;
        proxy_set_header X-Forwarded-Host  $picsou_xfh;
        proxy_set_header X-Forwarded-Port  $picsou_xfport;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Caisse d'Epargne login completion blocks while the user approves the
    # Sécur'Pass push on their phone: up to 150 s in the sidecar, 170 s in the
    # backend. The generic 60 s of `location /` would cut it and show a 504.
    location = /api/caisse-epargne/auth/complete {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $picsou_xfp;
        proxy_set_header X-Forwarded-Host  $picsou_xfh;
        proxy_set_header X-Forwarded-Port  $picsou_xfport;
        proxy_connect_timeout 30s;
        proxy_read_timeout 180s;
        proxy_send_timeout 60s;
    }

    # Crédit Mutuel Épargne Salariale login completion blocks while the user
    # approves the mobile confirmation: up to 120 s in the sidecar, 150 s in the
    # backend. The generic 60 s of `location /` would cut it and show a 504.
    location = /api/cmes/auth/complete {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $picsou_xfp;
        proxy_set_header X-Forwarded-Host  $picsou_xfh;
        proxy_set_header X-Forwarded-Port  $picsou_xfport;
        proxy_connect_timeout 30s;
        proxy_read_timeout 180s;
        proxy_send_timeout 60s;
    }

    # CIC login completion blocks while the user
    # approves the mobile confirmation: up to 120 s in the sidecar, 150 s in the
    # backend. The generic 60 s of `location /` would cut it and show a 504.
    location = /api/cic/auth/complete {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $picsou_xfp;
        proxy_set_header X-Forwarded-Host  $picsou_xfh;
        proxy_set_header X-Forwarded-Port  $picsou_xfport;
        proxy_connect_timeout 30s;
        proxy_read_timeout 180s;
        proxy_send_timeout 60s;
    }

    # Caisse d'Epargne keypad: the sidecar clicks the ten keys and Valider (up to
    # 60 s) before answering, so the backend gives it 70 s. The generic 60 s of `location /`
    # would cut it and show a 504.
    location = /api/caisse-epargne/auth/keypad {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $picsou_xfp;
        proxy_set_header X-Forwarded-Host  $picsou_xfh;
        proxy_set_header X-Forwarded-Port  $picsou_xfport;
        proxy_connect_timeout 30s;
        proxy_read_timeout 90s;
        proxy_send_timeout 60s;
    }

    # Embedded MCP server (Model Context Protocol) — HTTP+SSE transport.
    # GET /mcp is a long-lived Server-Sent Events stream; POST /mcp/message carries
    # the JSON-RPC. SSE needs buffering off and a long read timeout, or nginx would
    # withhold events and cut the stream. AccessKeyAuthFilter gates /mcp/** (a psk_
    # bearer key); the backend never serves /api to a key (security Property A).
    location /mcp {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $picsou_xfp;
        proxy_set_header X-Forwarded-Host  $picsou_xfh;
        proxy_set_header X-Forwarded-Port  $picsou_xfport;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
