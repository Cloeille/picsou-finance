services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - picsou-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./secrets/enablebanking.pem:/run/secrets/enablebanking.pem:ro
    environment:
      # Only variables that need Docker Compose interpolation (JDBC URL construction)
      # All other vars (including those with $ or \n) come from env_file as-is
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}?sslmode=prefer
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # The frontend is the only member assigned this address on the isolated
      # ingress network below. Tomcat therefore accepts forwarded client
      # addresses only from that exact nginx peer.
      SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES: '172\.30\.254\.2'
      BOURSO_AUTH_URL: http://bourso-auth:8001
      CAISSE_EPARGNE_AUTH_URL: http://caisse-epargne-auth:8001
      BOURSE_DIRECT_AUTH_URL: http://bourse-direct-auth:8001
      AMUNDI_AUTH_URL: http://amundi-auth:8001
      FORTUNEO_AUTH_URL: http://fortuneo-auth:8001
      AMEX_AUTH_URL: http://amex-auth:8001
      DEGIRO_AUTH_URL: http://degiro-auth:8001
      CMES_AUTH_URL: http://cmes-auth:8001
      CIC_AUTH_URL: http://cic-auth:8001
      CORUM_AUTH_URL: http://corum-auth:8001
      SOFIDY_AUTH_URL: http://sofidy-auth:8001
      APP_SIDECAR_API_KEY: ${APP_SIDECAR_API_KEY:?Set APP_SIDECAR_API_KEY}
      # Opt-in anonymous telemetry: empty DSN = feature fully inactive (docs/features/telemetry.md)
      APP_TELEMETRY_DSN: ${APP_TELEMETRY_DSN:-}
      APP_TELEMETRY_ENVIRONMENT: ${APP_TELEMETRY_ENVIRONMENT:-production}
    depends_on:
      db:
        condition: service_healthy
      bourso-auth:
        condition: service_started
      caisse-epargne-auth:
        condition: service_started
      bourse-direct-auth:
        condition: service_started
      degiro-auth:
        condition: service_started
      cmes-auth:
        condition: service_started
      cic-auth:
        condition: service_started
      amundi-auth:
        condition: service_started
      fortuneo-auth:
        condition: service_started
      amex-auth:
        condition: service_started
      corum-auth:
        condition: service_started
      sofidy-auth:
        condition: service_started
    networks:
      picsou-net:
      fortuneo-auth-net:
      picsou-ingress:
        aliases:
          - ingress-backend
        ipv4_address: 172.30.254.3

  # Shared sidecar base images (services/base). Never started (`scale: 0`).
  # `docker compose pull` fetches them by name; their layers are the ones the
  # published sidecars are built from, so nothing is downloaded twice.
  # `--build` builds them before the sidecars (Compose v2.33+).
  sidecar-python:
    image: ghcr.io/cloeille/picsou-finance/sidecar-python:latest
    build:
      context: ./services/base
      target: python
    scale: 0

  sidecar-chromium:
    image: ghcr.io/cloeille/picsou-finance/sidecar-chromium:latest
    build:
      context: ./services/base
      target: chromium
    scale: 0

  tr-auth:
    build:
      context: ./services/tr-auth
      dockerfile: Dockerfile
      args:
        SIDECAR_BASE: sidecar-chromium
      additional_contexts:
        sidecar-chromium: service:sidecar-chromium
    restart: unless-stopped
    environment:
      APP_SIDECAR_API_KEY: ${APP_SIDECAR_API_KEY:?Set APP_SIDECAR_API_KEY}
    networks:
      - picsou-net

  revolut-auth:
    build:
      context: ./services/revolut-auth
      dockerfile: Dockerfile
      args:
        SIDECAR_LIB: sidecar-python
      additional_contexts:
        sidecar-python: service:sidecar-python
    restart: unless-stopped
    environment:
      APP_SIDECAR_API_KEY: ${APP_SIDECAR_API_KEY:?Set APP_SIDECAR_API_KEY}
    networks:
      - picsou-net
    volumes:
      - revolut_profiles:/data/revolut-profiles

  bourse-direct-auth:
    build:
      context: ./services/bourse-direct-auth
      dockerfile: Dockerfile
      args:
        SIDECAR_BASE: sidecar-chromium
      additional_contexts:
        sidecar-chromium: service:sidecar-chromium
    restart: unless-stopped
    environment:
      APP_SIDECAR_API_KEY: ${APP_SIDECAR_API_KEY:?Set APP_SIDECAR_API_KEY}
    expose:
      - "8001"
    networks:
      - picsou-net

  amundi-auth:
    build:
      context: ./services/amundi-auth
      dockerfile: Dockerfile
      args:
        SIDECAR_BASE: sidecar-chromium
      additional_contexts:
        sidecar-chromium: service:sidecar-chromium
    restart: unless-stopped
    environment:
      APP_SIDECAR_API_KEY: ${APP_SIDECAR_API_KEY:?Set APP_SIDECAR_API_KEY}
    expose:
      - "8001"
    networks:
      - picsou-net

  fortuneo-auth:
    build:
      context: ./services/fortuneo-auth
      dockerfile: Dockerfile
      args:
        SIDECAR_BASE: sidecar-chromium
      additional_contexts:
        sidecar-chromium: service:sidecar-chromium
    restart: unless-stopped
    environment:
      APP_SIDECAR_API_KEY: ${APP_SIDECAR_API_KEY:?Set APP_SIDECAR_API_KEY}
    expose:
      - "8001"
    networks:
      - fortuneo-auth-net
      - fortuneo-egress

  corum-auth:
    build:
      context: ./services/corum-auth
      dockerfile: Dockerfile
      args:
        SIDECAR_BASE: sidecar-chromium
      additional_contexts:
        sidecar-chromium: service:sidecar-chromium
    restart: unless-stopped
    environment:
      APP_SIDECAR_API_KEY: ${APP_SIDECAR_API_KEY:?Set APP_SIDECAR_API_KEY}
    expose:
      - "8001"
    networks:
      - picsou-net

  sofidy-auth:
    build:
      context: ./services/sofidy-auth
      dockerfile: Dockerfile
      args:
        SIDECAR_BASE: sidecar-python
      additional_contexts:
        sidecar-python: service:sidecar-python
    restart: unless-stopped
    environment:
      APP_SIDECAR_API_KEY: ${APP_SIDECAR_API_KEY:?Set APP_SIDECAR_API_KEY}
    expose:
      - "8001"
    networks:
      - picsou-net

  bourso-auth:
    build:
      context: ./services/bourso-auth
      dockerfile: Dockerfile
      args:
        SIDECAR_BASE: sidecar-python
      additional_contexts:
        sidecar-python: service:sidecar-python
    restart: unless-stopped
    environment:
      APP_SIDECAR_API_KEY: ${APP_SIDECAR_API_KEY:?Set APP_SIDECAR_API_KEY}
    expose:
      - "8001"
    networks:
      - picsou-net

  caisse-epargne-auth:
    build:
      context: ./services/caisse-epargne-auth
      dockerfile: Dockerfile
      args:
        SIDECAR_BASE: sidecar-chromium
      additional_contexts:
        sidecar-chromium: service:sidecar-chromium
    restart: unless-stopped
    environment:
      APP_SIDECAR_API_KEY: ${APP_SIDECAR_API_KEY:?Set APP_SIDECAR_API_KEY}
    expose:
      - "8001"
    networks:
      - picsou-net

  amex-auth:
    build:
      context: ./services/amex-auth
      dockerfile: Dockerfile
      args:
        SIDECAR_LIB: sidecar-python
      additional_contexts:
        sidecar-python: service:sidecar-python
    restart: unless-stopped
    init: true
    expose:
      - "8001"
    environment:
      APP_SIDECAR_API_KEY: ${APP_SIDECAR_API_KEY:?APP_SIDECAR_API_KEY is required}
    networks:
      - picsou-net

  degiro-auth:
    build:
      context: ./services/degiro-auth
      dockerfile: Dockerfile
      args:
        SIDECAR_BASE: sidecar-python
      additional_contexts:
        sidecar-python: service:sidecar-python
    restart: unless-stopped
    environment:
      APP_SIDECAR_API_KEY: ${APP_SIDECAR_API_KEY:?Set APP_SIDECAR_API_KEY}
    networks:
      - picsou-net

  cmes-auth:
    build:
      context: ./services/cmes-auth
      dockerfile: Dockerfile
      args:
        SIDECAR_BASE: sidecar-python
      additional_contexts:
        sidecar-python: service:sidecar-python
    restart: unless-stopped
    environment:
      APP_SIDECAR_API_KEY: ${APP_SIDECAR_API_KEY:?Set APP_SIDECAR_API_KEY}
    networks:
      - picsou-net

  cic-auth:
    build:
      context: ./services/cic-auth
      dockerfile: Dockerfile
      args:
        SIDECAR_BASE: sidecar-python
      additional_contexts:
        sidecar-python: service:sidecar-python
    restart: unless-stopped
    environment:
      APP_SIDECAR_API_KEY: ${APP_SIDECAR_API_KEY:?Set APP_SIDECAR_API_KEY}
    networks:
      - picsou-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:8080"
    depends_on:
      - backend
    networks:
      # Retain the general application network for normal container egress and
      # published-port return traffic. Backend traffic still resolves only via
      # the ingress-backend alias on the isolated network below.
      picsou-net:
      picsou-ingress:
        ipv4_address: 172.30.254.2

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["ollama"]
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - picsou-net

volumes:
  pgdata:
  ollama_models:
  revolut_profiles:

networks:
  picsou-net:
    driver: bridge
  fortuneo-auth-net:
    driver: bridge
    internal: true
  fortuneo-egress:
    driver: bridge
  # Dedicated frontend -> backend path. If this subnet overlaps a local Docker/VPN
  # subnet, change it, both static addresses, and the backend's
  # SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES regex together. Trust only the
  # frontend's exact address.
  # No sidecar joins it, so 172.30.254.2 identifies only the nginx frontend.
  picsou-ingress:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.254.0/29
