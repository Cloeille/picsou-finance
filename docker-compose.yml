services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - picsou-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./secrets/enablebanking.pem:/run/secrets/enablebanking.pem:ro
    environment:
      # Only variables that need Docker Compose interpolation (JDBC URL construction)
      # All other vars (including those with $ or \n) come from env_file as-is
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}?sslmode=prefer
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      BOURSO_AUTH_URL: http://bourso-auth:8001
      BOURSE_DIRECT_AUTH_URL: http://bourse-direct-auth:8001
      AMUNDI_AUTH_URL: http://amundi-auth:8001
      FORTUNEO_AUTH_URL: http://fortuneo-auth:8001
    depends_on:
      db:
        condition: service_healthy
      bourso-auth:
        condition: service_started
      bourse-direct-auth:
        condition: service_started
      degiro-auth:
        condition: service_started
      amundi-auth:
        condition: service_started
      fortuneo-auth:
        condition: service_started
    networks:
      - picsou-net
      - fortuneo-auth-net

  tr-auth:
    build:
      context: ./services/tr-auth
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - picsou-net

  revolut-auth:
    build:
      context: ./services/revolut-auth
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - picsou-net
    volumes:
      - revolut_profiles:/data/revolut-profiles

  bourse-direct-auth:
    build:
      context: ./services/bourse-direct-auth
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8001"
    networks:
      - picsou-net

  amundi-auth:
    build:
      context: ./services/amundi-auth
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8001"
    networks:
      - picsou-net

  fortuneo-auth:
    build:
      context: ./services/fortuneo-auth
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8001"
    networks:
      - fortuneo-auth-net
      - fortuneo-egress

  bourso-auth:
    build:
      context: ./services/bourso-auth
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8001"
    networks:
      - picsou-net

  degiro-auth:
    build:
      context: ./services/degiro-auth
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - picsou-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:8080"
    depends_on:
      - backend
    networks:
      - picsou-net

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["ollama"]
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - picsou-net

volumes:
  pgdata:
  ollama_models:
  revolut_profiles:

networks:
  picsou-net:
    driver: bridge
  fortuneo-auth-net:
    driver: bridge
    internal: true
  fortuneo-egress:
    driver: bridge
