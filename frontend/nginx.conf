# Preserve the X-Forwarded-* values an upstream TLS terminator (Caddy, Traefik, NPM,
# Cloudflare Tunnel, …) sent, falling back to this nginx's own values only when it is
# the edge. The backend honors these (server.forward-headers-strategy=framework) so a
# same-origin HTTPS request is recognized as same-origin and not wrongly rejected by CORS.
# Port/host fall through to empty when the upstream sent nothing — nginx then omits the
# header and the backend derives the port from the scheme (443 for https, 80 for http).
map $http_x_forwarded_proto $picsou_xfp   { default $scheme; ~.+ $http_x_forwarded_proto; }
map $http_x_forwarded_host  $picsou_xfh   { default "";      ~.+ $http_x_forwarded_host;  }
map $http_x_forwarded_port  $picsou_xfport { default "";     ~.+ $http_x_forwarded_port;  }

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — serve index.html for all non-asset routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend
    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $picsou_xfp;
        proxy_set_header X-Forwarded-Host  $picsou_xfh;
        proxy_set_header X-Forwarded-Port  $picsou_xfport;
        # Headroom for slow third-party syncs; backend caps its own waits.
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # OAuth2 authorization server (native iOS app: Authorization Code + PKCE).
    # /oauth2/authorize, /oauth2/token, /oauth2/jwks are served by the backend; without
    # this block they would fall through to the SPA index.html. The in-app browser hits
    # /oauth2/authorize, the backend redirects unauthenticated users to the SPA /login,
    # and the auth-code callback targets the app's picsou:// custom scheme.
    location /oauth2 {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $picsou_xfp;
        proxy_set_header X-Forwarded-Host  $picsou_xfh;
        proxy_set_header X-Forwarded-Port  $picsou_xfport;
    }

    # OAuth2 discovery metadata (remote-MCP OAuth: claude.ai).
    # RFC 8414 authorization-server metadata + RFC 9728 protected-resource metadata are
    # served by the backend but live under /.well-known/ (outside the /oauth2 prefix), so
    # without this block they would fall through to the SPA index.html. A remote MCP client
    # fetches these to discover the authorize/token/register endpoints. Prefix match wins
    # over `location /`. (/oauth2/register — RFC 7591 DCR — is already covered by /oauth2.)
    location /.well-known/oauth- {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $picsou_xfp;
        proxy_set_header X-Forwarded-Host  $picsou_xfh;
        proxy_set_header X-Forwarded-Port  $picsou_xfport;
    }

    # Proxy actuator health checks to backend
    location /actuator {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $picsou_xfp;
        proxy_set_header X-Forwarded-Host  $picsou_xfh;
        proxy_set_header X-Forwarded-Port  $picsou_xfport;
    }

    # Embedded MCP server (Model Context Protocol) — HTTP+SSE transport.
    # GET /mcp is a long-lived Server-Sent Events stream; POST /mcp/message carries
    # the JSON-RPC. SSE needs buffering off and a long read timeout, or nginx would
    # withhold events and cut the stream. AccessKeyAuthFilter gates /mcp/** (a psk_
    # bearer key); the backend itself never serves /api to a key (security Property A).
    location /mcp {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $picsou_xfp;
        proxy_set_header X-Forwarded-Host  $picsou_xfh;
        proxy_set_header X-Forwarded-Port  $picsou_xfport;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Defining add_header in this block drops the server-level security headers
        # (nginx add_header inheritance), so re-declare them here — otherwise .js/.css
        # would be served without nosniff/CSP/etc. Keep in sync with the server block.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'" always;
        # No HSTS here either — see the rationale in the server block below.
    }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'" always;
    # HSTS is deliberately NOT set here. This container only ever serves plain
    # HTTP (:8080, published as :5173), where RFC 6797 §8.1 requires browsers to
    # ignore the header anyway — and behind a TLS terminator holding a
    # locally-issued certificate it becomes a lockout trap: the browser
    # remembers the policy, then refuses the "proceed anyway" bypass for an
    # untrusted certificate.
    #
    # This does not leave the split stack without an opt-in: the backend emits
    # HSTS on /api responses when HSTS_ENABLED=true (SecurityConfig reads
    # app.hsts-enabled), and one HSTS response is enough to set the policy for
    # the whole host. So an operator running this stack behind a
    # publicly-trusted certificate still turns the header on with the same
    # single flag as the all-in-one image.

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
