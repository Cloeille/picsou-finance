# The split development stack is an HTTP edge by default, so it trusts no
# upstream address headers. To run it behind a known reverse proxy, replace
# this file at /etc/nginx/conf.d/00-picsou-realip.conf with a read-only mount:
#
#   set_real_ip_from 192.0.2.10;
#   real_ip_header X-Forwarded-For;
#   real_ip_recursive on;
#
# Use the proxy's exact address or a dedicated proxy-only subnet. nginx then
# resolves $remote_addr from that trusted hop before default.conf replaces the
# outbound X-Forwarded-For header with the single resolved address.
