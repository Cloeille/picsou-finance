version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot bumps the SHA and the
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # init and analyze must run the same release: analyze refuses a config
    # written by a different init version, so a lone bump of either fails
    # every CodeQL job (#491, #492).
    groups:
      codeql-action:
        patterns:
          - github/codeql-action/*
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    # Spring Boot 4 and Spring AI 2 require each other, and with them Jackson 3,
    # Spring Security 7 and test changes. That is one coordinated migration on
    # 1.1.0, not a version bump: a lone parent or BOM bump does not compile
    # (#380 was reverted, #403 and #374 failed the same way). Minor and patch
    # updates within Boot 3.5 / Spring AI 1.1 still come through.
    ignore:
      - dependency-name: org.springframework.boot:spring-boot-starter-parent
        update-types: ["version-update:semver-major"]
      - dependency-name: org.springframework.ai:spring-ai-bom
        update-types: ["version-update:semver-major"]
  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: weekly
    # TypeScript 7 is the native port: typescript-eslint caps its peer range at
    # typescript <6.1.0 and tsconfig `baseUrl` is removed, so a lone major bump
    # does not lint or typecheck (#526). Minor and patch updates still come through.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  # All sidecars inherit these pins; requirements-{chromium,camoufox}.txt keep
  # browser-specific dependencies separate. Browser bumps require review
  # of the Camoufox protocol compatibility and the image smoke tests.
  - package-ecosystem: pip
    directory: /services/base
    schedule:
      interval: weekly
    # Camoufox 0.5.x requires Playwright <1.63 (this target pins 1.64.1) and
    # changes the installer that pin_camoufox.py subclasses. It is one
    # hand-written migration (Playwright pin, pin_camoufox.py, smoke_camoufox.py
    # in amex-auth and revolut-auth), not a version bump (see #383 and #490).
    ignore:
      - dependency-name: camoufox
        versions: [">=0.5"]
  # Includes the digest-pinned Python base and all application/sidecar images.
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
      - /docker
      - /services/*
    schedule:
      interval: weekly
    # The JDK major is pinned on purpose: the runtime image, the Maven build
    # image, backend/pom.xml (java.version + enforcer range) and the CI JDK
    # must move together as one migration. A lone Dependabot bump of either
    # image is never mergeable (it breaks the enforcer or runs untested code),
    # and non-LTS majors go end-of-life within six months.
    ignore:
      # Tag 21-jre-jammy: the JDK major is the major version.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
      # Tag 3.9-eclipse-temurin-21-alpine parses as 3.9.21, so a JDK change
      # looks like a patch or minor bump and update-types cannot isolate it.
      # The tag floats on Maven 3.9.x patches; move it by hand with the JDK.
      - dependency-name: maven
      # Only services/base uses the python image. It stays on 3.12 until a
      # deliberate runtime migration: for CPython 3.15, orjson (via camoufox)
      # publishes only manylinux_2_39 wheels, which bookworm's glibc 2.36
      # cannot install. services/base/test_dockerfile.py guards the pin.
      - dependency-name: python
        versions: [">=3.13"]
      # PostgreSQL 18 moves PGDATA and cannot open a 16 data directory: it is a
      # planned migration (mount path, upgrade path, chart, tests, docs), not a
      # tag bump. Tracked in #508.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
  # Compose image references are a separate ecosystem from Dockerfiles.
  - package-ecosystem: docker-compose
    directories:
      - /
      - /docker
    schedule:
      interval: weekly
    ignore:
      # Same pin as the docker entry above: the postgres image stays on 16 until
      # the planned PostgreSQL 18 migration (#508).
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
