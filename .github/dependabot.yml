version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot bumps the SHA and the
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze must run the same release: analyze refuses a config
      # written by a different init version, so a lone bump of either fails
      # every CodeQL job (#491, #492). Keep all update types (including major)
      # grouped together and evaluated before the catch-all group.
      codeql-action:
        applies-to: version-updates
        patterns:
          - github/codeql-action/*
      # Bundle non-breaking action bumps into one weekly PR; major bumps and
      # security updates stay separate.
      github-actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - github/codeql-action/*
        update-types:
          - minor
          - patch
  # The backend and the desktop shell that links it. Dependabot evaluates
  # `directories` per directory, so each crate gets its own grouped PR.
  - package-ecosystem: cargo
    directories:
      - /backend-rs
      - /desktop/src-tauri
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      bun-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # TypeScript 7 is the native port: typescript-eslint caps its peer range at
    # typescript <6.1.0 and tsconfig `baseUrl` is removed, so a lone major bump
    # does not lint or typecheck (#526). Minor and patch updates still come through.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  # All sidecars inherit requirements.txt; requirements-chromium.txt keeps the
  # Chromium Playwright pin separate from the Python base and follows upstream.
  - package-ecosystem: pip
    directory: /services/base
    schedule:
      interval: weekly
    groups:
      pip-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  # Camoufox stays two levels below /services/base so Dependabot's pip file
  # fetcher on /services/base (which also scans immediate child directories)
  # does not pick it up alongside requirements-chromium.txt.
  - package-ecosystem: pip
    directory: /services/base/targets/camoufox
    schedule:
      interval: weekly
    groups:
      pip-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Camoufox 0.5.x requires Playwright <1.63 (this target pins 1.64.1) and
      # changes the installer that pin_camoufox.py subclasses. It is one
      # hand-written migration (Playwright pin, pin_camoufox.py, smoke_camoufox.py
      # in amex-auth, bnp-auth and revolut-auth), not a version bump (#383, #490).
      - dependency-name: camoufox
        versions: [">=0.5"]
      # Playwright 1.65 sends a Juggler field (downloadOptions.legacyInterceptor)
      # the pinned Camoufox Firefox rejects (#658, #676). Keep this target on
      # 1.64.x while /services/base/requirements-chromium.txt follows upstream.
      - dependency-name: playwright
        versions: [">=1.65"]
  # Includes the digest-pinned Python base and all application/sidecar images.
  - package-ecosystem: docker
    directories:
      - /frontend
      - /docker
      - /services/*
    schedule:
      interval: weekly
    groups:
      docker-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Only services/base uses the python image. It stays on 3.12 until a
      # deliberate runtime migration: for CPython 3.15, orjson (via camoufox)
      # publishes only manylinux_2_39 wheels, which bookworm's glibc 2.36
      # cannot install. services/base/test_dockerfile.py guards the pin.
      - dependency-name: python
        versions: [">=3.13"]
      # PostgreSQL 18 moves PGDATA and cannot open a 16 data directory: it is a
      # planned migration (mount path, upgrade path, chart, tests, docs), not a
      # tag bump. Tracked in #508.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
  # Compose image references are a separate ecosystem from Dockerfiles.
  - package-ecosystem: docker-compose
    directories:
      - /
      - /docker
    schedule:
      interval: weekly
    groups:
      docker-compose-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Same pin as the docker entry above: the postgres image stays on 16 until
      # the planned PostgreSQL 18 migration (#508).
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
