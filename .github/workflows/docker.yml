name: Build & publish Docker images

# Called by CI after backend + frontend + e2e + every published sidecar are green.
# No workflow_dispatch: a manual run would publish latest/nightly without that gate.
on:
  workflow_call:

env:
  REGISTRY: ghcr.io

jobs:
  # Shared sidecar bases (services/base), published before the sidecars so every
  # sidecar is built FROM the same digest and Docker stores its layers once.
  base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      python: ${{ steps.refs.outputs.python }}
      chromium: ${{ steps.refs.outputs.chromium }}
      app-version: ${{ steps.versions.outputs.app-version }}
      image-tag: ${{ steps.versions.outputs.image-tag }}
      chart-release-version: ${{ steps.versions.outputs.chart-release-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Compute the immutable image tag once. The image builders and chart must
      # consume the same output so a chart can only name a tag this run pushes.
      - name: Compute publish versions
        id: versions
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          chart_release_version=""
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            app_version="${GITHUB_REF_NAME#v}"
            image_tag="$app_version"
            chart_release_version="$app_version"
          else
            app_version="nightly-${short_sha}"
            image_tag="sha-${short_sha}"
          fi
          {
            echo "app-version=$app_version"
            echo "image-tag=$image_tag"
            echo "chart-release-version=$chart_release_version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names
        id: names
        shell: bash
        run: |
          repo="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "python=${repo}/sidecar-python" >> "$GITHUB_OUTPUT"
          echo "chromium=${repo}/sidecar-chromium" >> "$GITHUB_OUTPUT"

      - name: Tags for the python base
        id: meta-python
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.names.outputs.python }}
          tags: |
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Build and push the python base
        id: python
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/base
          target: python
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-python.outputs.tags }}
          # Links the package to this repository so it inherits the repository's
          # access; check it is public after the first publish (anonymous pulls).
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=sidecar-python
          cache-to: type=gha,mode=max,scope=sidecar-python

      - name: Tags for the chromium base
        id: meta-chromium
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.names.outputs.chromium }}
          tags: |
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Build and push the chromium base
        id: chromium
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/base
          target: chromium
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-chromium.outputs.tags }}
          # Links the package to this repository so it inherits the repository's
          # access; check it is public after the first publish (anonymous pulls).
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=sidecar-chromium
          cache-to: type=gha,mode=max,scope=sidecar-chromium

      - name: Pin the bases by digest
        id: refs
        shell: bash
        env:
          PYTHON_REF: ${{ steps.names.outputs.python }}@${{ steps.python.outputs.digest }}
          CHROMIUM_REF: ${{ steps.names.outputs.chromium }}@${{ steps.chromium.outputs.digest }}
        run: |
          echo "python=${PYTHON_REF}" >> "$GITHUB_OUTPUT"
          echo "chromium=${CHROMIUM_REF}" >> "$GITHUB_OUTPUT"

  build:
    needs: base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            image: ${{ github.repository }}
            context: .
            dockerfile: docker/Dockerfile
            versioned: true
          - name: tr-auth
            image: ${{ github.repository }}/tr-auth
            context: services/tr-auth
            dockerfile: services/tr-auth/Dockerfile
            base: chromium
            versioned: false
          - name: revolut-auth
            image: ${{ github.repository }}/revolut-auth
            context: services/revolut-auth
            dockerfile: services/revolut-auth/Dockerfile
            lib: python
          - name: bourse-direct-auth
            image: ${{ github.repository }}/bourse-direct-auth
            context: services/bourse-direct-auth
            dockerfile: services/bourse-direct-auth/Dockerfile
            base: chromium
            versioned: false
          - name: amundi-auth
            image: ${{ github.repository }}/amundi-auth
            context: services/amundi-auth
            dockerfile: services/amundi-auth/Dockerfile
            base: chromium
            versioned: false
          - name: bourso-auth
            image: ${{ github.repository }}/bourso-auth
            context: services/bourso-auth
            dockerfile: services/bourso-auth/Dockerfile
            base: python
            versioned: false
          - name: caisse-epargne-auth
            image: ${{ github.repository }}/caisse-epargne-auth
            context: services/caisse-epargne-auth
            dockerfile: services/caisse-epargne-auth/Dockerfile
            base: chromium
            versioned: false
          - name: fortuneo-auth
            image: ${{ github.repository }}/fortuneo-auth
            context: services/fortuneo-auth
            dockerfile: services/fortuneo-auth/Dockerfile
            base: chromium
            versioned: false
          - name: corum-auth
            image: ${{ github.repository }}/corum-auth
            context: services/corum-auth
            dockerfile: services/corum-auth/Dockerfile
            base: chromium
            versioned: false
          - name: sofidy-auth
            image: ${{ github.repository }}/sofidy-auth
            context: services/sofidy-auth
            dockerfile: services/sofidy-auth/Dockerfile
            base: python
            versioned: false
          - name: amex-auth
            image: ${{ github.repository }}/amex-auth
            context: services/amex-auth
            dockerfile: services/amex-auth/Dockerfile
            lib: python
            versioned: false
          - name: degiro-auth
            image: ${{ github.repository }}/degiro-auth
            context: services/degiro-auth
            dockerfile: services/degiro-auth/Dockerfile
            base: python
            versioned: false
          - name: cmes-auth
            image: ${{ github.repository }}/cmes-auth
            context: services/cmes-auth
            dockerfile: services/cmes-auth/Dockerfile
            base: python
            versioned: false
          - name: cic-auth
            image: ${{ github.repository }}/cic-auth
            context: services/cic-auth
            dockerfile: services/cic-auth/Dockerfile
            base: python
            versioned: false

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag strategy (applied to every matrix image):
      #   - push on main             -> nightly + latest
      #   - push on any other branch -> branch name (e.g. 1.0.0, feature-foo)
      #   - push of a version tag    -> latest + the semver (e.g. 1.0.0, 1.0, 1)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          # metadata-action emits the pinned sha/semver tag and lowercases image names.
          tags: |
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Empty lines are dropped. A sidecar gets its base by digest, never a tag.
          build-args: |
            ${{ matrix.versioned && format('APP_VERSION={0}', needs.base.outputs.app-version) || '' }}
            ${{ matrix.base && format('SIDECAR_BASE={0}', needs.base.outputs[matrix.base]) || '' }}
            ${{ matrix.lib && format('SIDECAR_LIB={0}', needs.base.outputs[matrix.lib]) || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Publishes the Helm chart once every image of this commit is pushed, next to them
  # on GHCR (oci://ghcr.io/<owner>/charts/picsou):
  #   - version tag    -> the same version, pinned to that release's images
  #   - push on main   -> a pre-release (helm install --devel) pinned to this
  #                       commit's sha-<short> images
  # Standard sidecars missing from values.yaml are added to the packaged copy only;
  # the others are reported and left out until the chart supports them.
  chart:
    needs: [base, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # All tags, to find the latest release without a network call (the
          # checkout token is not persisted, so `git ls-remote` could not
          # authenticate on a private repository).
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Compute chart version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.base.outputs.chart-release-version }}
          IMAGE_TAG: ${{ needs.base.outputs.image-tag }}
        run: |
          number='(0|[1-9][0-9]*)'
          non_numeric='[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*'
          prerelease_identifier="(${number}|${non_numeric})"
          semver="^${number}\.${number}\.${number}(-${prerelease_identifier}(\.${prerelease_identifier})*)?$"
          if [[ -n "$RELEASE_VERSION" ]]; then
            version="$RELEASE_VERSION"
          else
            # Next patch after the highest tagged core, including prereleases.
            # Bump past RCs too so they cannot freeze the main channel.
            # The short sha gets a letter prefix: a numeric pre-release identifier
            # cannot start with 0.
            latest=$(git tag --list | sed 's/^v//' \
              | while IFS= read -r candidate; do
                  if [[ "$candidate" =~ $semver ]]; then
                    echo "${candidate%%-*}"
                  fi
                done \
              | sort -V | tail -1)
            IFS=. read -r major minor patch <<< "${latest:-0.0.0}"
            # Commit time keeps late-finishing pipelines from publishing newer versions.
            timestamp=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)
            version="${major}.${minor}.$((patch + 1))-main.${timestamp}.g${IMAGE_TAG#sha-}"
          fi
          if [[ ! "$version" =~ $semver ]]; then
            echo "::notice title=Helm chart::'$version' is not a semantic version, chart not published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "publish=true"
            echo "version=$version"
            echo "app-version=$IMAGE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Add the standard sidecars the chart does not list yet
        if: steps.version.outputs.publish == 'true'
        run: charts/picsou/sync-sidecars.sh --apply --github

      # The images above were pushed to ghcr.io/<this repository>: point the chart
      # there, so a chart published from a fork runs that fork's images.
      - name: Point the chart at this repository's images
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          repository="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          sed -i "s|^  imageRepository: .*|  imageRepository: ${repository}|" charts/picsou/values.yaml
          [ "$(yq -r .global.imageRepository charts/picsou/values.yaml)" = "$repository" ]

      - name: Lint the chart
        if: steps.version.outputs.publish == 'true'
        run: helm lint --strict charts/picsou
      - name: Render the default and the optional resources
        if: steps.version.outputs.publish == 'true'
        run: |
          helm template picsou charts/picsou > /dev/null
          helm template picsou charts/picsou \
            --set ingress.enabled=true \
            --set httpRoute.enabled=true --set 'httpRoute.parentRefs[0].name=gateway' \
            --set postgresql.enabled=false --set externalDatabase.host=db \
            --set secrets.existingSecret=picsou --set app.enableBanking.existingSecret=eb \
            --set 'networkPolicy.appIngressFrom[0].podSelector.matchLabels.app=ingress' > /dev/null
      - name: Test chart storage and upgrade safety
        if: steps.version.outputs.publish == 'true'
        run: python3 -m unittest discover -s charts/picsou/tests -v

      - name: Package
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APP_VERSION: ${{ steps.version.outputs.app-version }}
        run: |
          helm package charts/picsou --version "$VERSION" --app-version "$APP_VERSION" --destination dist

      - name: Push to GHCR
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          printf '%s' "$TOKEN" | helm registry login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/picsou-${VERSION}.tgz" "oci://${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/charts"
