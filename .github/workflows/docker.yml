name: Build & publish Docker images

# Called by CI after backend + frontend + e2e + sidecar are green.
# workflow_dispatch remains an escape hatch (manual publish without re-running CI).
on:
  workflow_call:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            image: ${{ github.repository }}
            context: .
            dockerfile: docker/Dockerfile
            versioned: true
          - name: tr-auth
            image: ${{ github.repository }}/tr-auth
            context: services/tr-auth
            dockerfile: services/tr-auth/Dockerfile
            versioned: false
          - name: bourse-direct-auth
            image: ${{ github.repository }}/bourse-direct-auth
            context: services/bourse-direct-auth
            dockerfile: services/bourse-direct-auth/Dockerfile
            versioned: false
          - name: amundi-auth
            image: ${{ github.repository }}/amundi-auth
            context: services/amundi-auth
            dockerfile: services/amundi-auth/Dockerfile
            versioned: false
          - name: bourso-auth
            image: ${{ github.repository }}/bourso-auth
            context: services/bourso-auth
            dockerfile: services/bourso-auth/Dockerfile
            versioned: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag strategy (applied to every matrix image):
      #   - push on main             -> nightly + latest
      #   - push on any other branch -> branch name (e.g. 1.0.0, feature-foo)
      #   - push of a version tag    -> latest + the semver (e.g. 1.0.0, 1.0, 1)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Compute app version
        id: app-version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then
            echo "version=nightly-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            safe_ref="${GITHUB_REF_NAME//\//-}"
            echo "version=${safe_ref}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.versioned && format('APP_VERSION={0}', steps.app-version.outputs.version) || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
