name: Build & publish Docker images

on:
  push:
    branches: ['**']
    tags: ['[0-9]*', 'v[0-9]*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            image: ${{ github.repository }}
            context: .
            dockerfile: docker/Dockerfile
            versioned: true
          - name: tr-auth
            image: ${{ github.repository }}/tr-auth
            context: services/tr-auth
            dockerfile: services/tr-auth/Dockerfile
            versioned: false
          - name: revolut-auth
            image: ${{ github.repository }}/revolut-auth
            context: services/revolut-auth
            dockerfile: services/revolut-auth/Dockerfile
          - name: bourse-direct-auth
            image: ${{ github.repository }}/bourse-direct-auth
            context: services/bourse-direct-auth
            dockerfile: services/bourse-direct-auth/Dockerfile
            versioned: false
          - name: amundi-auth
            image: ${{ github.repository }}/amundi-auth
            context: services/amundi-auth
            dockerfile: services/amundi-auth/Dockerfile
            versioned: false
          - name: bourso-auth
            image: ${{ github.repository }}/bourso-auth
            context: services/bourso-auth
            dockerfile: services/bourso-auth/Dockerfile
            versioned: false
          - name: fortuneo-auth
            image: ${{ github.repository }}/fortuneo-auth
            context: services/fortuneo-auth
            dockerfile: services/fortuneo-auth/Dockerfile
            versioned: false
          - name: corum-auth
            image: ${{ github.repository }}/corum-auth
            context: services/corum-auth
            dockerfile: services/corum-auth/Dockerfile
            versioned: false
          - name: sofidy-auth
            image: ${{ github.repository }}/sofidy-auth
            context: services/sofidy-auth
            dockerfile: services/sofidy-auth/Dockerfile
            versioned: false

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag strategy (applied to every matrix image):
      #   - push on main             -> nightly + latest
      #   - push on any other branch -> branch name (e.g. 1.0.0, feature-foo)
      #   - push of a version tag    -> latest + the semver (e.g. 1.0.0, 1.0, 1)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Compute app version
        id: app-version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then
            echo "version=nightly-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            safe_ref="${GITHUB_REF_NAME//\//-}"
            echo "version=${safe_ref}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.versioned && format('APP_VERSION={0}', steps.app-version.outputs.version) || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
