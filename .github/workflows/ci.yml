name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['[0-9]*', 'v[0-9]*']

permissions:
  contents: read

# A new push to a pull request cancels its stale run. Every other run gets its own
# group: a shared group would still replace a queued main push with the next one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Selects the jobs a pull request can affect. Pushes, tags and pull requests too
  # large for the files API (3000 files) skip the filter, which selects every job.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      release-deployment: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.release-deployment == 'true' }}
      docker-entrypoint: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.docker-entrypoint == 'true' }}
      backend: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.frontend == 'true' }}
      bourse-direct-sidecar: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.bourse-direct-sidecar == 'true' }}
      fortuneo-sidecar: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.fortuneo-sidecar == 'true' }}
      bourso-sidecar: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.bourso-sidecar == 'true' }}
      caisse-epargne-sidecar: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.caisse-epargne-sidecar == 'true' }}
      corum-sidecar: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.corum-sidecar == 'true' }}
      sofidy-sidecar: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.sofidy-sidecar == 'true' }}
      amundi-sidecar: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.amundi-sidecar == 'true' }}
      amex-auth-sidecar: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.amex-auth-sidecar == 'true' }}
      degiro-auth-sidecar: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.degiro-auth-sidecar == 'true' }}
      tr-auth-sidecar: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.tr-auth-sidecar == 'true' }}
      revolut-auth-sidecar: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.revolut-auth-sidecar == 'true' }}
      cmes-auth-sidecar: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.cmes-auth-sidecar == 'true' }}
      cic-auth-sidecar: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.cic-auth-sidecar == 'true' }}
      compose-sidecar-build: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.compose-sidecar-build == 'true' }}
      workflow-inventory: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.workflow-inventory == 'true' }}
      helm-chart: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.helm-chart == 'true' }}
      e2e: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.e2e == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request' && github.event.pull_request.changed_files < 3000
        with:
          # backend reads services/sofidy-auth (Java/Python contract), services/base
          # (its interpreter's pins) and docker/entrypoint.sh (HSTS parsing).
          filters: |
            workflows: &workflows
              - '.github/**'
            release-deployment:
              - *workflows
              - 'backend/**'
              - 'frontend/**'
              - 'docker/**'
              - '.dockerignore'
            docker-entrypoint:
              - *workflows
              - 'docker/**'
              - 'docker-compose.yml'
              - 'frontend/Dockerfile'
              - 'frontend/nginx.conf'
              - 'frontend/picsou-realip.conf'
            backend:
              - *workflows
              - 'backend/**'
              - 'services/base/**'
              - 'services/sofidy-auth/**'
              - 'docker/entrypoint.sh'
            frontend:
              - *workflows
              - 'frontend/**'
            bourse-direct-sidecar:
              - *workflows
              - 'services/base/**'
              - 'services/bourse-direct-auth/**'
            fortuneo-sidecar:
              - *workflows
              - 'services/base/**'
              - 'services/fortuneo-auth/**'
            bourso-sidecar:
              - *workflows
              - 'services/base/**'
              - 'services/bourso-auth/**'
            caisse-epargne-sidecar:
              - *workflows
              - 'services/base/**'
              - 'services/caisse-epargne-auth/**'
            corum-sidecar:
              - *workflows
              - 'services/base/**'
              - 'services/corum-auth/**'
            sofidy-sidecar:
              - *workflows
              - 'services/base/**'
              - 'services/sofidy-auth/**'
            amundi-sidecar:
              - *workflows
              - 'services/base/**'
              - 'services/amundi-auth/**'
            amex-auth-sidecar:
              - *workflows
              - 'services/base/**'
              - 'services/amex-auth/**'
            degiro-auth-sidecar:
              - *workflows
              - 'services/base/**'
              - 'services/degiro-auth/**'
            tr-auth-sidecar:
              - *workflows
              - 'services/base/**'
              - 'services/tr-auth/**'
            revolut-auth-sidecar:
              - *workflows
              - 'services/base/**'
              - 'services/revolut-auth/**'
            cmes-auth-sidecar:
              - *workflows
              - 'services/base/**'
              - 'services/cmes-auth/**'
            cic-auth-sidecar:
              - *workflows
              - 'services/base/**'
              - 'services/cic-auth/**'
            compose-sidecar-build:
              - *workflows
              - 'services/**'
              - 'docker/docker-compose.yml'
            workflow-inventory:
              - *workflows
              - 'services/**'
              - 'docker-compose.yml'
              - 'docker/docker-compose.yml'
              - 'docker/Dockerfile'
            helm-chart:
              - *workflows
              - 'charts/**'
              - 'docker/docker-compose.yml'
            e2e:
              - *workflows
              - 'frontend/**'

  release-deployment:
    needs: changes
    if: needs.changes.outputs.release-deployment == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check deployment shell syntax
        run: bash -n docker/deploy.sh
      - name: Lint deployment shell script
        run: shellcheck -x docker/deploy.sh
      - name: Install deployment test runner
        run: python3 -m pip install pytest
      - name: Test preflight ordering, failure isolation, and API readiness
        run: python3 -m pytest docker/tests/test_deploy.py -v
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # A cold build downloads every Maven and bun dependency, and Maven Central answers
      # shared runner IPs with 429 Too Many Requests. Reusing the layers of the release
      # build (docker.yml, scope `app`) and of earlier smoke builds keeps registries out
      # of the run unless backend/pom.xml, frontend/package.json or frontend/bun.lock
      # changed, or the cached layers are missing (evicted or cache unavailable).
      # mode=max is required: the dependency layers live in the build stages, not the
      # final image. ignore-error keeps a cache export failure from failing the job.
      - name: Build the real release image for migration smoke tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          tags: picsou-release-smoke:test
          load: true
          cache-from: |
            type=gha,scope=release-smoke
            type=gha,scope=app
          cache-to: type=gha,mode=max,scope=release-smoke,ignore-error=true
      - name: Exercise packaged CLI, repeat deployment, and incompatible-schema isolation
        env:
          PICSOU_RELEASE_TEST_IMAGE: picsou-release-smoke:test
        run: python3 -m pytest docker/tests/test_deploy_integration.py -v -s

  docker-entrypoint:
    needs: changes
    if: needs.changes.outputs.docker-entrypoint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check entrypoint syntax
        run: bash -n docker/entrypoint.sh
      - name: Install Docker proxy test runner
        run: python3 -m pip install pytest
      - name: Test secrets passed to the backend process
        run: python -m unittest discover -s docker/tests -p 'test_entrypoint.py' -v
      - name: Test trusted proxy client address forwarding
        run: |
          docker info > /dev/null
          python3 -m pytest docker/tests/test_proxy_client_ip.py -v

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the Sofidy contract interpreter
        run: pip install -r services/base/requirements.txt
      - name: Run backend tests
        # Migration tests skip themselves when Docker is unreachable so local runs
        # without a socket still work. Runners always have Docker, so require it here --
        # otherwise environment drift would silently drop the PostgreSQL coverage of
        # data-mutating migrations and the build would stay green.
        env:
          # SidecarWebClientFactory (shared by the Bourso, DEGIRO, Trade Republic, Amundi,
          # Bourse Direct, AMEX, CORUM and Sofidy adapters) fails the Spring context if this key is
          # blank. Runners hold no bank secrets, so a fresh value is enough — the adapters never call
          # out for real in the test suite.
          APP_SIDECAR_API_KEY: ci-test-only
          PICSOU_REQUIRE_DOCKER_TESTS: 'true'
        run: mvn -B test -Dsofidy.contract.python=python3
        working-directory: backend
      - name: Require the SCPI PostgreSQL tests
        run: >-
          grep -q 'Tests run: 7, Failures: 0, Errors: 0, Skipped: 0'
          backend/target/surefire-reports/com.picsou.service.ScpiSyncSessionPostgresTest.txt
      - name: Require the HomeBank PostgreSQL persistence tests
        run: |
          grep -q 'Tests run: 2, Failures: 0, Errors: 0, Skipped: 0' \
            backend/target/surefire-reports/com.picsou.service.HomeBankImportPersistenceTest.txt
          grep -q 'Tests run: 1, Failures: 0, Errors: 0, Skipped: 0' \
            backend/target/surefire-reports/com.picsou.service.HomeBankQifPersistenceTest.txt
      - name: Require the legacy migration renumbering tests
        run: >-
          grep -q 'Tests run: 15, Failures: 0, Errors: 0, Skipped: 0'
          backend/target/surefire-reports/com.picsou.migration.LegacyMigrationRenumberingTest.txt
      - name: Require the sidecar Budget PostgreSQL tests
        run: >-
          grep -q 'Tests run: 6, Failures: 0, Errors: 0, Skipped: 0'
          backend/target/surefire-reports/com.picsou.service.SidecarBudgetPostgresTest.txt

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Cache bun downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
      - name: Install
        run: bun install --frozen-lockfile
        working-directory: frontend
      - name: Lint
        run: bun run lint
        working-directory: frontend
      - name: Typecheck
        run: bun run typecheck
        working-directory: frontend
      - name: Unit tests
        run: bun run test
        working-directory: frontend

  bourse-direct-sidecar:
    needs: changes
    if: needs.changes.outputs.bourse-direct-sidecar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the shared chromium sidecar base
        run: docker build --target chromium --tag picsou-sidecar-chromium services/base
      - name: Build the Chromium-only sidecar image
        run: docker build --tag picsou-bourse-direct-auth:test services/bourse-direct-auth
      - name: Run parser, lifecycle, and browser navigation tests
        run: >-
          docker run --rm --ipc=host
          --env PYTHONPATH=/app
          --volume "${{ github.workspace }}/services/bourse-direct-auth/test_main.py:/tests/test_main.py:ro"
          --volume "${{ github.workspace }}/services/bourse-direct-auth/test_navigation.py:/tests/test_navigation.py:ro"
          --volume "${{ github.workspace }}/services/bourse-direct-auth/test_lifecycle.py:/tests/test_lifecycle.py:ro"
          --volume "${{ github.workspace }}/services/bourse-direct-auth/test_sidecar_auth.py:/tests/test_sidecar_auth.py:ro"
          --env APP_SIDECAR_API_KEY=test-key
          --workdir /tests
          picsou-bourse-direct-auth:test
          python -m unittest discover -v

  fortuneo-sidecar:
    needs: changes
    if: needs.changes.outputs.fortuneo-sidecar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the shared chromium sidecar base
        run: docker build --target chromium --tag picsou-sidecar-chromium services/base
      - name: Build the Chromium-only sidecar image
        run: docker build --tag picsou-fortuneo-auth:test services/fortuneo-auth
      - name: Run parser, lifecycle, and browser navigation tests
        run: >-
          docker run --rm --ipc=host
          --env PYTHONPATH=/app
          --volume "${{ github.workspace }}/services/fortuneo-auth/test_main.py:/tests/test_main.py:ro"
          --volume "${{ github.workspace }}/services/fortuneo-auth/test_navigation.py:/tests/test_navigation.py:ro"
          --volume "${{ github.workspace }}/services/fortuneo-auth/test_lifecycle.py:/tests/test_lifecycle.py:ro"
          --volume "${{ github.workspace }}/services/fortuneo-auth/test_sidecar_auth.py:/tests/test_sidecar_auth.py:ro"
          --env APP_SIDECAR_API_KEY=test-key
          --workdir /tests
          picsou-fortuneo-auth:test
          python -m unittest discover -v

  bourso-sidecar:
    needs: changes
    if: needs.changes.outputs.bourso-sidecar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the shared python sidecar base
        run: docker build --target python --tag picsou-sidecar-python services/base
      - name: Build the browserless sidecar image
        run: docker build --tag picsou-bourso-auth:test services/bourso-auth
      - name: Run parser, contract and lifecycle tests
        run: >-
          docker run --rm
          --env PYTHONPATH=/app
          --volume "${{ github.workspace }}/services/bourso-auth/fixtures.py:/tests/fixtures.py:ro"
          --volume "${{ github.workspace }}/services/bourso-auth/test_virtual_pad.py:/tests/test_virtual_pad.py:ro"
          --volume "${{ github.workspace }}/services/bourso-auth/test_accounts_parser.py:/tests/test_accounts_parser.py:ro"
          --volume "${{ github.workspace }}/services/bourso-auth/test_life_insurance.py:/tests/test_life_insurance.py:ro"
          --volume "${{ github.workspace }}/services/bourso-auth/test_main.py:/tests/test_main.py:ro"
          --volume "${{ github.workspace }}/services/bourso-auth/test_lifecycle.py:/tests/test_lifecycle.py:ro"
          --volume "${{ github.workspace }}/services/bourso-auth/test_sidecar_auth.py:/tests/test_sidecar_auth.py:ro"
          --env APP_SIDECAR_API_KEY=test-key
          --workdir /tests
          picsou-bourso-auth:test
          python -m unittest discover -v

  caisse-epargne-sidecar:
    needs: changes
    if: needs.changes.outputs.caisse-epargne-sidecar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the shared chromium sidecar base
        run: docker build --target chromium --tag picsou-sidecar-chromium services/base
      - name: Build the sidecar image
        run: docker build --tag picsou-caisse-epargne-auth:test services/caisse-epargne-auth
      # Every test is a stdlib `unittest` case, so the production image runs
      # them as is. The whole services/ tree is mounted read-only:
      # test_dockerfile.py checks this service's Dockerfile and the shared
      # chromium base in services/base.
      - name: Run parser, replay, fetcher, login and contract tests
        run: >-
          docker run --rm
          --env PYTHONDONTWRITEBYTECODE=1
          --volume "${{ github.workspace }}/services:/src/services:ro"
          --env APP_SIDECAR_API_KEY=test-key
          --workdir /src/services/caisse-epargne-auth
          picsou-caisse-epargne-auth:test
          python -m unittest discover -v

  corum-sidecar:
    needs: changes
    if: needs.changes.outputs.corum-sidecar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the shared chromium sidecar base
        run: docker build --target chromium --tag picsou-sidecar-chromium services/base
      - name: Build the Chromium-only sidecar image
        run: docker build --tag picsou-corum-auth:test services/corum-auth
      - name: Run parser, navigation and live-contract tests
        run: >-
          docker run --rm --ipc=host
          --env PYTHONPATH=/app
          --env CORUM_BROWSER_TESTS=1
          --env APP_SIDECAR_API_KEY=test-key
          --volume "${{ github.workspace }}/services/corum-auth/test_positions_parser.py:/tests/test_positions_parser.py:ro"
          --volume "${{ github.workspace }}/services/corum-auth/test_live_contract.py:/tests/test_live_contract.py:ro"
          --volume "${{ github.workspace }}/services/corum-auth/test_navigation_security.py:/tests/test_navigation_security.py:ro"
          --volume "${{ github.workspace }}/services/corum-auth/test_sidecar_auth.py:/tests/test_sidecar_auth.py:ro"
          --workdir /tests
          picsou-corum-auth:test
          python -m unittest discover -v

  sofidy-sidecar:
    needs: changes
    if: needs.changes.outputs.sofidy-sidecar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the shared python sidecar base
        run: docker build --target python --tag picsou-sidecar-python services/base
      - name: Build the browserless sidecar image
        run: docker build --tag picsou-sofidy-auth:test services/sofidy-auth
      - name: Run parser, redirect and live-contract tests
        run: >-
          docker run --rm
          --env PYTHONPATH=/app
          --volume "${{ github.workspace }}/services/sofidy-auth/test_positions_parser.py:/tests/test_positions_parser.py:ro"
          --volume "${{ github.workspace }}/services/sofidy-auth/test_live_contract.py:/tests/test_live_contract.py:ro"
          --volume "${{ github.workspace }}/services/sofidy-auth/test_redirect_security.py:/tests/test_redirect_security.py:ro"
          --volume "${{ github.workspace }}/services/sofidy-auth/test_java_contract.py:/tests/test_java_contract.py:ro"
          --volume "${{ github.workspace }}/services/sofidy-auth/test_sidecar_auth.py:/tests/test_sidecar_auth.py:ro"
          --env APP_SIDECAR_API_KEY=test-key
          --workdir /tests
          picsou-sofidy-auth:test
          python -m unittest discover -v

  amundi-sidecar:
    needs: changes
    if: needs.changes.outputs.amundi-sidecar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the shared chromium sidecar base
        run: docker build --target chromium --tag picsou-sidecar-chromium services/base
      - name: Build the Chromium-only sidecar image
        run: docker build --tag picsou-amundi-auth:test services/amundi-auth
      - name: Run parser and lifecycle tests
        run: >-
          docker run --rm --ipc=host
          --env PYTHONPATH=/app
          --volume "${{ github.workspace }}/services/amundi-auth/test_main.py:/tests/test_main.py:ro"
          --volume "${{ github.workspace }}/services/amundi-auth/test_lifecycle.py:/tests/test_lifecycle.py:ro"
          --volume "${{ github.workspace }}/services/amundi-auth/test_sidecar_auth.py:/tests/test_sidecar_auth.py:ro"
          --env APP_SIDECAR_API_KEY=test-key
          --workdir /tests
          picsou-amundi-auth:test
          python -m unittest discover -v

  amex-auth-sidecar:
    needs: changes
    if: needs.changes.outputs.amex-auth-sidecar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the AMEX sidecar image
        run: docker build --tag picsou-amex-auth:test services/amex-auth
      - name: Run sidecar authentication and browser pinning tests in the image
        run: >-
          docker run --rm
          --entrypoint python
          --env PYTHONPATH=/app
          --env APP_SIDECAR_API_KEY=test-key
          --volume "${{ github.workspace }}/services/amex-auth/test_sidecar_auth.py:/tests/test_sidecar_auth.py:ro"
          --volume "${{ github.workspace }}/services/amex-auth/test_pin_camoufox.py:/tests/test_pin_camoufox.py:ro"
          --workdir /tests
          picsou-amex-auth:test
          -m unittest discover -v

  degiro-auth-sidecar:
    needs: changes
    if: needs.changes.outputs.degiro-auth-sidecar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the shared python sidecar base
        run: docker build --target python --tag picsou-sidecar-python services/base
      - name: Build the DEGIRO sidecar image
        run: docker build --tag picsou-degiro-auth:test services/degiro-auth
      - name: Run sidecar tests in the image
        run: >-
          docker run --rm
          --entrypoint python
          --env PYTHONPATH=/app
          --env APP_SIDECAR_API_KEY=test-key
          --volume "${{ github.workspace }}/services/degiro-auth/test_portfolio_url.py:/tests/test_portfolio_url.py:ro"
          --volume "${{ github.workspace }}/services/degiro-auth/test_portfolio_parser.py:/tests/test_portfolio_parser.py:ro"
          --volume "${{ github.workspace }}/services/degiro-auth/test_log_safety.py:/tests/test_log_safety.py:ro"
          --volume "${{ github.workspace }}/services/degiro-auth/test_sidecar_auth.py:/tests/test_sidecar_auth.py:ro"
          --workdir /tests
          picsou-degiro-auth:test
          -m unittest discover -v

  cmes-auth-sidecar:
    needs: changes
    if: needs.changes.outputs.cmes-auth-sidecar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the shared python sidecar base
        run: docker build --target python --tag picsou-sidecar-python services/base
      - name: Build the Crédit Mutuel Épargne Salariale sidecar image
        run: docker build --tag picsou-cmes-auth:test services/cmes-auth
      - name: Run sidecar tests in the image
        run: >-
          docker run --rm
          --entrypoint python
          --env PYTHONPATH=/app
          --env APP_SIDECAR_API_KEY=test-key
          --volume "${{ github.workspace }}/services/cmes-auth/fixtures.py:/tests/fixtures.py:ro"
          --volume "${{ github.workspace }}/services/cmes-auth/test_parsers.py:/tests/test_parsers.py:ro"
          --volume "${{ github.workspace }}/services/cmes-auth/test_main.py:/tests/test_main.py:ro"
          --volume "${{ github.workspace }}/services/cmes-auth/test_sidecar_auth.py:/tests/test_sidecar_auth.py:ro"
          --workdir /tests
          picsou-cmes-auth:test
          -m unittest discover -v

  cic-auth-sidecar:
    needs: changes
    if: needs.changes.outputs.cic-auth-sidecar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the shared python sidecar base
        run: docker build --target python --tag picsou-sidecar-python services/base
      - name: Build the CIC online-banking sidecar image
        run: docker build --tag picsou-cic-auth:test services/cic-auth
      - name: Run sidecar tests in the image
        run: >-
          docker run --rm
          --entrypoint python
          --env PYTHONPATH=/app
          --env APP_SIDECAR_API_KEY=test-key
          --volume "${{ github.workspace }}/services/cic-auth/fixtures.py:/tests/fixtures.py:ro"
          --volume "${{ github.workspace }}/services/cic-auth/test_accounts_parser.py:/tests/test_accounts_parser.py:ro"
          --volume "${{ github.workspace }}/services/cic-auth/test_main.py:/tests/test_main.py:ro"
          --volume "${{ github.workspace }}/services/cic-auth/test_sidecar_auth.py:/tests/test_sidecar_auth.py:ro"
          --workdir /tests
          picsou-cic-auth:test
          -m unittest discover -v

  tr-auth-sidecar:
    needs: changes
    if: needs.changes.outputs.tr-auth-sidecar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the shared chromium sidecar base
        run: docker build --target chromium --tag picsou-sidecar-chromium services/base
      - name: Build the Trade Republic sidecar image
        run: docker build --tag picsou-tr-auth:test services/tr-auth
      - name: Run sidecar tests in the image
        run: >-
          docker run --rm
          --entrypoint python
          --env PYTHONPATH=/app
          --env APP_SIDECAR_API_KEY=test-key
          --volume "${{ github.workspace }}/services/tr-auth/main.py:/tests/main.py:ro"
          --volume "${{ github.workspace }}/services/tr-auth/test_complete_url.py:/tests/test_complete_url.py:ro"
          --volume "${{ github.workspace }}/services/tr-auth/test_log_safety.py:/tests/test_log_safety.py:ro"
          --volume "${{ github.workspace }}/services/tr-auth/test_main.py:/tests/test_main.py:ro"
          --volume "${{ github.workspace }}/services/tr-auth/test_mask_phone.py:/tests/test_mask_phone.py:ro"
          --volume "${{ github.workspace }}/services/tr-auth/test_refresh_method.py:/tests/test_refresh_method.py:ro"
          --volume "${{ github.workspace }}/services/tr-auth/test_sidecar_auth.py:/tests/test_sidecar_auth.py:ro"
          --volume "${{ github.workspace }}/services/tr-auth/test_waf_rejection.py:/tests/test_waf_rejection.py:ro"
          --workdir /tests
          picsou-tr-auth:test
          -m unittest discover -v

  revolut-auth-sidecar:
    needs: changes
    if: needs.changes.outputs.revolut-auth-sidecar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the Revolut sidecar image
        run: docker build --tag picsou-revolut-auth:test services/revolut-auth
      # The async tests need pytest-asyncio, a test-only dependency the image does not ship.
      - name: Run sidecar tests in the image
        run: >-
          docker run --rm
          --entrypoint sh
          --env PYTHONDONTWRITEBYTECODE=1
          --env APP_SIDECAR_API_KEY=test-key
          --volume "${{ github.workspace }}/services/revolut-auth/tests:/app/tests:ro"
          picsou-revolut-auth:test
          -c "python -m pip install --user --no-cache-dir --no-warn-script-location pytest==8.4.2 pytest-asyncio==1.2.0
          && python -m pytest -p no:cacheprovider -p no:logging --asyncio-mode=auto -v tests"

  compose-sidecar-build:
    needs: changes
    if: needs.changes.outputs.compose-sidecar-build == 'true'
    # The Compose wiring (build-only bases, `additional_contexts: service:`)
    # as users run it, not only as YAML assertions.
    runs-on: ubuntu-latest
    env:
      APP_SIDECAR_API_KEY: ci-test-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Resolve the published Compose file
        run: |
          docker compose version
          docker compose -f docker/docker-compose.yml config --quiet
      - name: Build one sidecar per base through Compose
        run: docker compose -f docker/docker-compose.yml build tr-auth bourso-auth
      - name: The sidecars run on their base
        run: >-
          docker compose -f docker/docker-compose.yml run --rm --no-deps
          --entrypoint python tr-auth
          -c "import os, playwright; assert os.environ['PLAYWRIGHT_BROWSERS_PATH'] == '/opt/playwright-browsers'"
      - name: Tear down without a profile
        run: docker compose -f docker/docker-compose.yml down --volumes --remove-orphans

  workflow-inventory:
    needs: changes
    if: needs.changes.outputs.workflow-inventory == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install workflow test dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Check sidecar workflow inventory
        run: python -m unittest discover -s .github/tests -v

  # A sidecar missing from the chart is a warning, never a failure: publishing adds
  # the standard ones (docker.yml, chart job) and the chart maintainer follows up
  # on the others. A chart that does not lint or render fails.
  helm-chart:
    needs: changes
    if: needs.changes.outputs.helm-chart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: Lint the chart
        run: helm lint --strict charts/picsou
      - name: Render the default and the optional resources
        run: |
          helm template picsou charts/picsou > /dev/null
          helm template picsou charts/picsou \
            --set ingress.enabled=true \
            --set httpRoute.enabled=true --set 'httpRoute.parentRefs[0].name=gateway' \
            --set postgresql.enabled=false --set externalDatabase.host=db \
            --set secrets.existingSecret=picsou --set app.enableBanking.existingSecret=eb \
            --set 'networkPolicy.appIngressFrom[0].podSelector.matchLabels.app=ingress' > /dev/null
      - name: Test chart storage and upgrade safety
        run: python3 -m unittest discover -s charts/picsou/tests -v
      - name: Compare the chart's sidecars with the Compose file
        run: |
          status=0
          charts/picsou/sync-sidecars.sh --check --github || status=$?
          # 2 means differences, already reported as warnings.
          [ "$status" -eq 0 ] || [ "$status" -eq 2 ]

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Cache bun downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
      - name: Install
        run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run Playwright E2E (demo mode)
        env:
          VITE_DEMO_MODE: 'true'
        run: bun run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Green only when every release-blocking job the change selected passed and no
  # such job failed or was cancelled. Helm validation remains an independent check:
  # chart failures must not prevent application images from being published.
  ci-ok:
    if: always()
    needs:
      - changes
      - release-deployment
      - docker-entrypoint
      - backend
      - frontend
      - e2e
      - bourse-direct-sidecar
      - fortuneo-sidecar
      - bourso-sidecar
      - caisse-epargne-sidecar
      - corum-sidecar
      - sofidy-sidecar
      - amundi-sidecar
      - amex-auth-sidecar
      - degiro-auth-sidecar
      - tr-auth-sidecar
      - revolut-auth-sidecar
      - cmes-auth-sidecar
      - cic-auth-sidecar
      - compose-sidecar-build
      - workflow-inventory
    runs-on: ubuntu-latest
    steps:
      - name: Every selected job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -en --argjson needs "$NEEDS" '
            $needs.changes.outputs as $selected
            | [$needs | to_entries[]
                | select(.value.result != "success"
                    and (.value.result != "skipped" or $selected[.key] != "false"))
                | "\(.key): \(.value.result)"]
            | if . == [] then true else error("not green: \(join(", "))") end'

  # Images are only published after every release-blocking CI job is green, and
  # only on a push to main or a version tag — not on pull requests.
  docker:
    needs:
      - ci-ok
      - release-deployment
      - docker-entrypoint
      - backend
      - frontend
      - e2e
      - bourse-direct-sidecar
      - fortuneo-sidecar
      - bourso-sidecar
      - caisse-epargne-sidecar
      - corum-sidecar
      - sofidy-sidecar
      - amundi-sidecar
      - amex-auth-sidecar
      - degiro-auth-sidecar
      - tr-auth-sidecar
      - revolut-auth-sidecar
      - cmes-auth-sidecar
      - cic-auth-sidecar
      - compose-sidecar-build
      - workflow-inventory
    if: github.event_name == 'push'
    uses: ./.github/workflows/docker.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
