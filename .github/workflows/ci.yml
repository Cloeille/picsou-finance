name: CI

on:
  pull_request:
  push:
    branches: [main, 'release/**']
    tags: ['[0-9]*', 'v[0-9]*']

permissions: {contents: read}

# A new push to a pull request cancels its stale run. Every other run gets its own
# group: a shared group would still replace a queued main push with the next one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Selects the jobs a pull request can affect. Pushes, tags and pull requests too
  # large for the files API (3000 files) skip the filter, which selects every job.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read, pull-requests: read}
    outputs:
      # The jobs to run, as a JSON list; `all` is 'true' when the filter did not run.
      all: ${{ steps.filter.outcome == 'skipped' }}
      jobs: ${{ steps.sidecars.outputs.jobs }}
      sidecar-matrix: ${{ steps.sidecars.outputs.matrix }}
      # The release smoke case ids, one release-deployment leg each.
      release-cases: ${{ steps.release.outputs.release-cases }}
    steps:
      # &name defines a step that later jobs reuse as *name.
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request' && github.event.pull_request.changed_files < 3000
        with:
          list-files: json
          filters: |
            workflows: &workflows ['.github/**', 'Makefile']
            # Not a job: a change to the dependencies the release image downloads
            # makes the release smoke build refresh its cache.
            release-deps: ['backend-rs/Cargo.toml', 'backend-rs/Cargo.lock', 'backend-rs/macros/**',
                           'frontend/package.json', 'frontend/bun.lock']
            release-deployment: [*workflows, 'backend-rs/**', 'frontend/**', 'docker/**', '.dockerignore']
            docker-compose: [*workflows, 'docker/**']
            backend-rs: &backend-rs [*workflows, 'backend-rs/**']
            frontend: [*workflows, 'frontend/**']
            # The entrypoint tests read each Camoufox sidecar's runtime parameters.
            sidecar-base: [*workflows, 'services/base/**', 'services/*-auth/Dockerfile']
            # A change under .github or services/base selects every sidecar,
            # one under services/<name>-auth only that one (sidecars.py --select).
            sidecar: [*workflows, 'services/base/**', 'services/*-auth/**']
            compose-sidecar-build: [*workflows, 'services/**', 'docker/docker-compose.yml']
            native-sidecars: [*workflows, 'services/base/**', 'services/*-auth/**']
            # The shell links the backend.
            desktop: [*backend-rs, 'desktop/**']
            desktop-windows: [*backend-rs, 'desktop/**']
            desktop-macos: [*backend-rs, 'desktop/**']
            workflow-inventory: [*workflows, 'services/**', 'backend-rs/src/sidecars.tsv', '.env.example',
                                 'docker/.env.example', 'docker/docker-compose.yml', 'docker/Dockerfile']
            helm-chart: [*workflows, 'charts/**', 'backend-rs/src/sidecars.tsv', 'docker/docker-compose.yml']
            e2e: [*workflows, 'frontend/**']
      - name: Select the jobs and the sidecar matrix
        id: sidecars
        env:
          # Over 1000 paths, every sidecar runs: the list stays under the 128 KiB env limit.
          ALL: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.sidecar_count >= 1000 }}
          CHANGES: ${{ steps.filter.outputs.changes }}
          FILES: ${{ steps.filter.outputs.sidecar_count < 1000 && steps.filter.outputs.sidecar_files || '[]' }}
        run: python3 .github/scripts/sidecars.py --select
      - name: List the release smoke cases
        id: release
        run: python3 .github/scripts/release_cases.py >> "$GITHUB_OUTPUT"
  release-deployment:
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.jobs), 'release-deployment')
    name: release-deployment (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `unit` runs the script checks; every other leg builds the image and runs one case.
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.changes.outputs.release-cases) }}
        include: [{task: unit}]
    steps:
      - *checkout
      - &python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - name: Check and lint the deployment shell script
        if: matrix.task == 'unit'
        run: bash -n docker/deploy.sh && shellcheck -x docker/deploy.sh
      - name: Test preflight ordering, failure isolation, and API readiness
        if: matrix.task == 'unit'
        run: python3 -m pip install pytest && python3 -m pytest docker/tests/test_deploy.py -v
      # The legs come from changes.outputs.release-cases: a case pytest collects but no
      # leg runs would never be tested.
      - name: Every collected smoke case has its own leg
        if: matrix.task == 'unit'
        env: {CASES: '${{ needs.changes.outputs.release-cases }}'}
        run: |
          ids=$(python3 -m pytest --collect-only -q docker/tests/test_deploy_integration.py \
            | tee /dev/stderr | sed -n 's/.*\[\(.*\)\]$/\1/p' | jq -Rnc '[inputs]')
          [ "$ids" = "$(jq -c . <<< "$CASES")" ] || { echo "::error::collected $ids, legs $CASES"; exit 1; }
      # The case pulls these images; fetching them during the build saves the wait.
      - name: Pull the PostgreSQL and Caddy images in the background
        if: matrix.task != 'unit'
        run: grep -oE '(postgres|caddy):[^ ]+' docker/docker-compose.yml | sort -u | xargs -P 0 -n 1 docker pull --quiet > /dev/null &
      - name: Set up Docker Buildx
        if: matrix.task != 'unit'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # A cold build downloads every crate and bun dependency. Reusing the layers of the
      # release build (docker.yml, scope `app`) and of earlier smoke builds keeps registries
      # out of the run unless the backend's manifests or macros crate, frontend/package.json or
      # frontend/bun.lock changed, or the cached layers are missing (evicted or cache unavailable).
      # mode=max is required: the dependency layers live in the build stages, not the
      # final image. ignore-error keeps a cache export failure from failing the job.
      # Only the http leg exports, and on a pull request only when those files changed:
      # the export costs 20-60 s and a pull request's cache is invisible to main.
      - name: Build the real release image for migration smoke tests
        if: matrix.task != 'unit'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          tags: picsou-release-smoke:test
          load: true
          cache-from: |
            type=gha,scope=release-smoke
            type=gha,scope=app
          cache-to: >-
            ${{ matrix.task == 'http' && (github.event_name == 'push'
            || contains(fromJSON(needs.changes.outputs.jobs), 'release-deps'))
            && 'type=gha,mode=max,scope=release-smoke,ignore-error=true' || '' }}
      # A skipped case reports green: require the one selected case to pass.
      - name: Exercise packaged CLI, repeat deployment, and incompatible-schema isolation
        if: matrix.task != 'unit'
        env: {PICSOU_RELEASE_TEST_IMAGE: 'picsou-release-smoke:test', CASE: '${{ matrix.task }}'}
        # pipefail: without it tee would hide pytest's exit code (an error after the pass).
        run: |
          set -o pipefail
          python3 -m pip install pytest
          python3 -m pytest -v -s \
            "docker/tests/test_deploy_integration.py::test_packaged_release_migrates_repeats_and_preserves_api_on_bad_schema[$CASE]" \
            | tee case.txt
          grep -q ' 1 passed' case.txt

  docker-compose:
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.jobs), 'docker-compose')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - *checkout
      - *python
      - name: Test the Compose password and data-permissions wiring
        run: python -m unittest discover -s docker/tests -p 'test_compose.py' -v
      - name: Test the Compose trusted proxy addresses
        run: |
          docker info > /dev/null
          python3 -m pip install pytest
          python3 -m pytest docker/tests/test_proxy_client_ip.py -v

  # The backend (docs/decisions/2026-11-21-rust-backend.md): a lint leg (fmt, clippy, the unit and
  # doc tests) next to the integration tests, the route inventory included, on the PostgreSQL
  # major it targets and on embedded SQLite, in shards. ci-ok checks the shards ran every test
  # once (docs/decisions/2026-11-24-rust-ci-cache-and-shards.md).
  backend-rs:
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.jobs), 'backend-rs')
    name: backend-rs (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {task: lint}
          - {task: postgres-1, shard: 1/3}
          - {task: postgres-2, shard: 2/3}
          - {task: postgres-3, shard: 3/3}
          - {task: sqlite-1, db: sqlite, shard: 1/2}
          - {task: sqlite-2, db: sqlite, shard: 2/2}
    env:
      # Debug information only slows the build: a failed test still names its file and line.
      CARGO_PROFILE_DEV_DEBUG: '0'
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: picsou, POSTGRES_HOST_AUTH_METHOD: trust}
        ports: ['127.0.0.1:55432:5432']
        # The data stays in memory: the suite creates and drops one database per test.
        options: >-
          --health-cmd "pg_isready -U picsou" --health-interval 2s --health-timeout 5s --health-retries 30
          --tmpfs /var/lib/postgresql/data
    steps:
      - *checkout
      # The dependencies, compiled: every leg restores the one cache, and only the lint leg of a
      # branch push saves it, so pull requests add nothing to the repository's 10 GB of caches.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend-rs
          shared-key: backend-rs
          save-if: ${{ github.event_name == 'push' && github.ref_type == 'branch' && matrix.task == 'lint' }}
      - name: Format, lint and run the unit tests
        if: matrix.task == 'lint'
        run: make lint-backend unit-backend
      - name: Integration tests (${{ matrix.db || 'postgres' }}, shard ${{ matrix.shard }})
        if: matrix.task != 'lint'
        # pipefail: without it tee would hide a failed test.
        run: |
          set -o pipefail
          make integration-backend DB=${{ matrix.db }} SHARD=${{ matrix.shard }} 2>&1 | tee "$RUNNER_TEMP/tests.txt"
      - name: Upload the test output
        if: matrix.task != 'lint'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: "backend-rs-${{ matrix.task }}", path: "${{ runner.temp }}/tests.txt", if-no-files-found: error, retention-days: 7}

  frontend:
    name: frontend (${{ matrix.task }})
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.jobs), 'frontend')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: [{task: lint}, {task: test-1, shard: 1, total: 2}, {task: test-2, shard: 2, total: 2}]
    steps:
      - *checkout
      - &bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - &bun-cache
        name: Cache bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: {path: ~/.bun/install/cache, key: "bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}"}
      - &bun-install
        name: Install
        run: make deps
      - name: Lint and typecheck
        if: matrix.task == 'lint'
        run: make lint-frontend
      - name: Unit tests (shard ${{ matrix.shard }}/${{ matrix.total }})
        if: matrix.task != 'lint'
        run: make unit-frontend SHARD=${{ matrix.shard }}/${{ matrix.total }} VITEST_JSON=${{ runner.temp }}/vitest-${{ matrix.task }}.json
      - name: Upload the Vitest report
        if: matrix.task != 'lint'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: "vitest-${{ matrix.task }}", path: "${{ runner.temp }}/vitest-${{ matrix.task }}.json", if-no-files-found: error, retention-days: 7}

  # services/base tests. The Camoufox target inherits the python one, so it runs them all.
  sidecar-base:
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.jobs), 'sidecar-base')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *checkout
      - name: Run the shared package, installer and entrypoint tests in the Camoufox base
        run: make test-sidecar-base

  # One job per services/*-auth folder (.github/scripts/sidecars.py), plus a native
  # ARM64 one for Camoufox sidecars. Each sidecar keeps its tests as test_*.py stdlib
  # unittest modules next to main.py; `make test-sidecar` builds the image and runs them.
  sidecar:
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.jobs), 'sidecar')
    name: sidecar (${{ matrix.service }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.sidecar-matrix) }}
    steps:
      - *checkout
      # Builds the shared base, then the image; checks it runs main.py non-root on its
      # base (Camoufox ones also start the browser offline), then runs the tests in it.
      - name: Build and test the ${{ matrix.service }} image
        run: make test-sidecar SIDECAR=${{ matrix.service }} ARCH=${{ matrix.arch }}

  # The browserless sidecars outside a container, on the systems the desktop app targets
  # (#235): their tests, then a start on 127.0.0.1 and one /health call.
  native-sidecars:
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.jobs), 'native-sidecars')
    name: native-sidecars (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - *checkout
      # CPython 3.12 security releases ship no installers, so setup-python stops at 3.12.10,
      # whose html.parser fails a cic-auth guard the base image (3.12.16) passes. uv runs the
      # python-build-standalone build of the latest patch, the runtime the desktop app bundles.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Test and start each browserless sidecar
        run: >-
          uv run --no-project --managed-python --python 3.12
          --with-requirements services/base/requirements.txt
          python .github/scripts/native_sidecars.py

  # The desktop shell (#235): the supervisor's unit tests and a locked release build.
  # Not in ci-ok: a crates.io or apt outage must not hold back the image publish.
  desktop:
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.jobs), 'desktop')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run: {working-directory: desktop/src-tauri}
    # Release LTO and a single codegen unit only slow CI; the bundles keep both (desktop-release.yml).
    # Debug information slows the test build and swells its cache.
    env: &desktop-build-env
      CARGO_PROFILE_RELEASE_LTO: 'off'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - *checkout
      # The shell's dependencies, compiled: restored by every run, saved by branch pushes only.
      - &desktop-rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
          save-if: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
      - name: Install the webview build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Test and build the shell
        run: |
          # bundle.resources points at the gitignored runtime, which tauri-build requires to exist.
          mkdir -p ../runtime
          cargo test --locked
          cargo build --locked --release

  # The unsigned Windows installer (#591): the shell, which links the backend, and the SPA, installed silently,
  # then the installed app must reach the dashboard on loopback and leave no process when killed.
  desktop-windows:
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.jobs), 'desktop-windows')
    runs-on: windows-latest
    timeout-minutes: 40
    env: *desktop-build-env
    steps:
      - *checkout
      - *desktop-rust-cache
      - *python
      - *bun
      - name: Build the SPA
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run build
      - name: Assemble the Windows runtime (CPython, the Chromium sidecars)
        run: python desktop/scripts/fetch_runtime.py --target windows
      - name: Build the installer
        working-directory: desktop/src-tauri
        run: npx --yes @tauri-apps/cli@2.12.4 build --bundles nsis
      - name: Install it and start the installed app
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $setup = Start-Process $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode) { throw "the installer exited with $($setup.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Picsou\picsou-desktop.exe'
          if (-not (Test-Path $exe)) { throw "$exe is not installed" }
          $app = Start-Process $exe -PassThru
          $data = "$env:LOCALAPPDATA/com.picsou.desktop"
          $ready = $false
          foreach ($i in 1..120) {
            Start-Sleep 2
            $port = Get-Content "$data/desktop-port" -ErrorAction SilentlyContinue
            if ($port) {
              try { Invoke-WebRequest "http://127.0.0.1:$port/actuator/health/readiness" -UseBasicParsing -TimeoutSec 5 | Out-Null; $ready = $true; break } catch {}
            }
          }
          if (-not $ready) { throw 'the installed app never became ready' }
          "ready after $($i * 2) s on port $port"
          Invoke-WebRequest "http://127.0.0.1:$port/api/setup/status" -UseBasicParsing -TimeoutSec 5 | Select-Object -ExpandProperty Content
          # The SPA is served from the install folder: the one check of a backslash SPA_LOCATION.
          $page = (Invoke-WebRequest "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 5).Content
          if ($page -notmatch '<div id="root"') { throw 'the SPA is not served' }
          # /actuator/info tells the SPA it runs in the desktop app and which banks the app lacks:
          # none of the three Camoufox banks, which sign in through the OS WebView instead.
          # Actuator answers application/vnd.spring-boot.actuator.v3+json, which Invoke-WebRequest leaves as bytes.
          $info = (Invoke-RestMethod "http://127.0.0.1:$port/actuator/info" -TimeoutSec 5).app
          "desktop: $($info.desktop), unavailable: $($info.'desktop-unavailable')"
          if ("$($info.desktop)" -ne 'true' -or "$($info.'desktop-unavailable')" -match 'bnp-auth|amex-auth|revolut-auth') { throw 'the desktop flags are wrong' }
          # Chromium is fetched in the background right after the start, before any sync asks.
          $t0 = Get-Date
          foreach ($try in 1..60) { if (Test-Path "$data/browsers/chromium_headless_shell-*/INSTALLATION_COMPLETE") { break }; Start-Sleep 5 }
          if (-not (Test-Path "$data/browsers/chromium_headless_shell-*/INSTALLATION_COMPLETE")) { throw 'Chromium was not prefetched' }
          "Chromium prefetched $([int]((Get-Date) - $t0).TotalSeconds) s after ready, before any corum call"
          # The one-off `playwright install` exits once Chromium is in place.
          foreach ($try in 1..12) { if (-not (Get-Process python -ErrorAction SilentlyContinue)) { break }; Start-Sleep 5 }
          # Bank sidecars (#589): none runs at idle.
          if (Get-Process python -ErrorAction SilentlyContinue) { throw 'a sidecar runs at idle' }
          # BoursoBank is one of the six banks the backend serves in-process: no sidecar starts.
          $bourso = Invoke-WebRequest "http://127.0.0.1:$port/api/setup/integrations/boursobank/health" -UseBasicParsing -TimeoutSec 90 | Select-Object -ExpandProperty Content
          "bourso health: $bourso"
          if ($bourso -notmatch '"ok":true') { throw 'the in-process bourso connector did not answer' }
          if (Get-Process python -ErrorAction SilentlyContinue) { throw 'an in-process bank started a sidecar' }
          # A Chromium sidecar starts on the first call, on loopback: its first start downloads
          # Chromium once, the next start reuses it.
          $corum = (Get-Content "$data/sidecar-ports.json" | ConvertFrom-Json).CORUM_AUTH_URL
          $t0 = Get-Date; $ok = $false
          # 503 while Chromium downloads, then the sidecar's own /health.
          foreach ($try in 1..120) {
            try { Invoke-WebRequest "$corum/health" -UseBasicParsing -TimeoutSec 10 | Out-Null; $ok = $true; break } catch { Start-Sleep 5 }
          }
          if (-not $ok) { throw 'the corum sidecar never answered' }
          "corum first start: $([int]((Get-Date) - $t0).TotalSeconds) s"
          if (-not (Test-Path "$data/browsers/chromium_headless_shell-*")) { throw 'Chromium was not downloaded' }
          Get-Content "$data/logs/browser-download.log" -Tail 3
          $pids = (Get-Process picsou-desktop, python -ErrorAction SilentlyContinue).Id
          $listening = Get-NetTCPConnection -State Listen | Where-Object { $pids -contains $_.OwningProcess }
          $listening | Format-Table LocalAddress, LocalPort, OwningProcess
          if (@($listening).Count -lt 2) { throw 'expected the backend and the corum sidecar to listen' }
          if ($listening | Where-Object LocalAddress -notin '127.0.0.1', '::ffff:127.0.0.1') { throw 'a service listens beyond loopback' }
          # A hard kill, like a crash: the job object must take the sidecars with it.
          Stop-Process -Id $app.Id -Force
          Start-Sleep 10
          $left = Get-Process python -ErrorAction SilentlyContinue
          if ($left) { $left | Format-Table Name, Id; throw 'processes outlived the app' }
          'no process left'
          # An update (#588): data last opened by an older version is copied before it starts.
          Set-Content "$data/app-version" '1.0.0' -NoNewline
          Remove-Item "$data/desktop-port"
          $app = Start-Process $exe -PassThru
          $ready = $false
          foreach ($i in 1..120) {
            Start-Sleep 2
            $port = Get-Content "$data/desktop-port" -ErrorAction SilentlyContinue
            if ($port) {
              try { Invoke-WebRequest "http://127.0.0.1:$port/actuator/health/readiness" -UseBasicParsing -TimeoutSec 5 | Out-Null; $ready = $true; break } catch {}
            }
          }
          if (-not $ready) { throw 'the app never became ready after an update' }
          $copy = Get-ChildItem "$data/backups" -Directory | Where-Object Name -like '*-1.0.0-to-*'
          if (-not $copy -or -not (Test-Path "$($copy.FullName)/picsou.db")) { throw 'no copy of the data from before the update' }
          "update ready after $($i * 2) s, copy: $($copy.Name), marker: $(Get-Content $data/app-version)"
          Stop-Process -Id $app.Id -Force
      - name: Show the app logs
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "$env:LOCALAPPDATA/com.picsou.desktop/logs" -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object {
            "===== $($_.Name)"
            Get-Content $_.FullName -Tail 60
          }
      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: picsou-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  # The macOS app (#591): Apple Silicon, ad-hoc signed because the project has no Apple Developer
  # account. Started through LaunchServices like a double click, then the Windows job's checks:
  # ready, a sidecar on demand, loopback only, nothing left after a hard kill, a backup on update.
  desktop-macos:
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.jobs), 'desktop-macos')
    runs-on: macos-latest
    timeout-minutes: 40
    env: *desktop-build-env
    steps:
      - *checkout
      - *desktop-rust-cache
      - *python
      - *bun
      - name: Build the SPA
        working-directory: frontend
        run: bun install --frozen-lockfile && bun run build
      - name: Assemble the macOS runtime (CPython, the Chromium sidecars)
        run: python desktop/scripts/fetch_runtime.py --target macos
      - name: Build the app and the disk image
        working-directory: desktop/src-tauri
        run: npx --yes @tauri-apps/cli@2.12.4 build --bundles app,dmg
      - name: Start the app and check it
        run: |
          app="$PWD/desktop/src-tauri/target/release/bundle/macos/Picsou.app"
          # Apple Silicon runs no unsigned code: the ad-hoc signature must hold.
          codesign --verify --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -q 'Signature=adhoc'
          data="$HOME/Library/Application Support/com.picsou.desktop"
          runtime="$app/Contents/Resources/runtime"
          ready() {
            for i in $(seq 1 120); do
              sleep 2
              port=$(cat "$data/desktop-port" 2>/dev/null || true)
              if [ -n "$port" ] && curl -fs "http://127.0.0.1:$port/actuator/health/readiness" >/dev/null; then
                echo "ready after $((i * 2)) s on port $port"; return 0
              fi
            done
            echo "::error::$1"; return 1
          }
          open -n "$app"
          ready 'the app never became ready'
          port=$(cat "$data/desktop-port")
          curl -fs "http://127.0.0.1:$port/api/setup/status"; echo
          curl -fs "http://127.0.0.1:$port/" | grep -q '<div id="root"'
          # The OS WebView signs in to the three Camoufox banks, so the app lacks none of them.
          curl -fs "http://127.0.0.1:$port/actuator/info" | jq -e '(.app.desktop | tostring) == "true" and (.app["desktop-unavailable"] | test("bnp-auth|amex-auth|revolut-auth") | not)'
          # Chromium is fetched right after the start; the one-off installer then exits.
          for try in $(seq 1 60); do ls "$data"/browsers/chromium_headless_shell-*/INSTALLATION_COMPLETE >/dev/null 2>&1 && break; sleep 5; done
          ls "$data"/browsers/chromium_headless_shell-*/INSTALLATION_COMPLETE
          for try in $(seq 1 12); do pgrep -f "$runtime/python" >/dev/null || break; sleep 5; done
          if pgrep -f "$runtime/python" >/dev/null; then echo '::error::a sidecar runs at idle'; exit 1; fi
          # BoursoBank is one of the six banks the backend serves in-process: no sidecar starts.
          bourso=$(curl -s --max-time 90 "http://127.0.0.1:$port/api/setup/integrations/boursobank/health")
          echo "bourso health: $bourso"
          case "$bourso" in *'"ok":true'*) ;; *) echo '::error::the in-process bourso connector did not answer'; exit 1 ;; esac
          if pgrep -f "$runtime/python" >/dev/null; then echo '::error::an in-process bank started a sidecar'; exit 1; fi
          # A Chromium sidecar starts on the first call, on loopback.
          corum=$(jq -r .CORUM_AUTH_URL "$data/sidecar-ports.json")
          for try in $(seq 1 60); do curl -fs --max-time 10 "$corum/health" >/dev/null && break; sleep 5; done
          curl -fs "$corum/health"; echo
          # The backend runs in the app process itself.
           pids=$({ pgrep -f "$runtime/"; pgrep -f "$app/Contents/MacOS/picsou-desktop"; } | paste -sd, -)
          listening=$(lsof -nP -iTCP -sTCP:LISTEN -a -p "$pids" | awk 'NR > 1 {print $9}' | sort -u)
          echo "$listening"
          [ "$(echo "$listening" | wc -l)" -ge 2 ] || { echo '::error::expected the backend and the corum sidecar to listen'; exit 1; }
          if echo "$listening" | grep -v '^127\.0\.0\.1:'; then echo '::error::a service listens beyond loopback'; exit 1; fi
          # A hard kill, like a crash: each child's watcher must end it (macOS has no PDEATHSIG).
          pkill -9 -f "$app/Contents/MacOS/picsou-desktop"
          for try in $(seq 1 30); do pgrep -f "$runtime/" >/dev/null || break; sleep 1; done
          if pgrep -fl "$runtime/"; then echo '::error::processes outlived the app'; exit 1; fi
          echo "no process left after $try s"
          # An update (#588): data last opened by an older version is copied before it starts.
          printf 1.0.0 > "$data/app-version"
          rm "$data/desktop-port"
          open -n "$app"
          ready 'the app never became ready after an update'
          copy=$(ls -d "$data"/backups/*-1.0.0-to-* | head -1)
          [ -f "$copy/picsou.db" ] || { echo '::error::no copy of the data from before the update'; exit 1; }
          echo "update copy: $(basename "$copy"), marker: $(cat "$data/app-version")"
          pkill -9 -f "$app/Contents/MacOS/picsou-desktop"
      - name: Show the app logs
        if: failure()
        run: |
          for f in "$HOME/Library/Application Support/com.picsou.desktop/logs/"*.log; do echo "===== $f"; tail -60 "$f"; done
      - name: Upload the disk image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: picsou-macos-dmg
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  compose-sidecar-build:
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.jobs), 'compose-sidecar-build')
    # The Compose wiring (build-only bases, `additional_contexts: service:`)
    # as users run it, not only as YAML assertions.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: {APP_SIDECAR_API_KEY: ci-test-only}
    steps:
      - *checkout
      - name: Resolve the published Compose file and build one sidecar per base through it
        run: |
          docker compose version
          docker compose -f docker/docker-compose.yml config --quiet
          make build SERVICES="tr-auth bourso-auth amex-auth"
      - name: The sidecars run on their base
        run: >-
          docker compose -f docker/docker-compose.yml run --rm --no-deps
          --entrypoint python tr-auth
          -c "import os, playwright; assert os.environ['PLAYWRIGHT_BROWSERS_PATH'] == '/opt/playwright-browsers'"
      - name: Tear down without a profile
        run: docker compose -f docker/docker-compose.yml down --volumes --remove-orphans

  workflow-inventory:
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.jobs), 'workflow-inventory')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - *checkout
      - *python
      - name: Check sidecar workflow inventory
        run: |
          python -m pip install PyYAML==6.0.3
          python -m unittest discover -s .github/tests -v

  # A sidecar missing from the chart is a warning, never a failure: publishing adds
  # the standard ones (docker.yml, chart job) and the chart maintainer follows up
  # on the others. A chart that does not lint or render fails.
  helm-chart:
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.jobs), 'helm-chart')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - *checkout
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with: {version: v4.3.1}
      - name: Lint the chart
        run: helm lint --strict charts/picsou
      - name: Render the default and the optional resources
        run: |
          helm template picsou charts/picsou > /dev/null
          helm template picsou charts/picsou \
            --set ingress.enabled=true \
            --set httpRoute.enabled=true --set 'httpRoute.parentRefs[0].name=gateway' \
            --set postgresql.enabled=false --set externalDatabase.host=db \
            --set secrets.existingSecret=picsou --set app.enableBanking.existingSecret=eb \
            --set 'networkPolicy.appIngressFrom[0].podSelector.matchLabels.app=ingress' > /dev/null
      - name: Test chart storage and upgrade safety
        run: python3 -m unittest discover -s charts/picsou/tests -v
      - name: Compare the chart's sidecars with the Compose file
        run: |
          status=0
          charts/picsou/sync-sidecars.sh --check --github || status=$?
          # 2 means differences, already reported as warnings.
          [ "$status" -eq 0 ] || [ "$status" -eq 2 ]

  e2e:
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.jobs), 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout
      - *bun
      - *bun-cache
      - *bun-install
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: {path: ~/.cache/ms-playwright, key: "playwright-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}"}
      - name: Install Playwright Chromium
        run: cd frontend && bunx playwright install chromium
      - name: Probe a headless Chromium launch
        id: chromium-probe
        continue-on-error: true
        timeout-minutes: 3
        working-directory: frontend
        # Node, as the Playwright CLI runs under it (its shebang), not bun's runtime.
        run: node -e "require('@playwright/test').chromium.launch().then((browser) => browser.close())"
      - name: Install Chromium system libraries (fallback)
        if: steps.chromium-probe.outcome == 'failure'
        timeout-minutes: 12
        run: |
          echo "::notice title=e2e-deps-fallback::Chromium could not start; installing its system libraries"
          cd frontend && bunx playwright install-deps chromium
      - name: Run E2E (demo mode)
        run: make test-e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: playwright-report, path: frontend/playwright-report/, retention-days: 7}

  # Green only when every release-blocking job the change selected passed and no
  # such job failed or was cancelled. Helm validation and the desktop build remain
  # independent checks: neither ships in the images, so their failures must not
  # prevent application images from being published.
  ci-ok:
    if: always()
    needs: [changes, release-deployment, docker-compose, backend-rs, frontend, e2e, sidecar-base, sidecar, native-sidecars, compose-sidecar-build, workflow-inventory]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every selected job succeeded
        env: {NEEDS: '${{ toJSON(needs) }}'}
        run: |
          jq -en --argjson needs "$NEEDS" '
            $needs.changes.outputs as $out
            | [$needs | to_entries[] | .key as $job
                | select(.value.result != "success" and (.value.result != "skipped"
                    or $out.all == "true" or ($out.jobs // "" | if . == "" then "[]" else . end | fromjson | index($job)) != null))
                | "\(.key): \(.value.result)"]
            | if . == [] then true else error("not green: \(join(", "))") end'
      # A green matrix only proves each shard passed what it selected: check the reports
      # cover every test file, from a checkout of just the test sources and the scripts.
      - name: Check out the test sources
        if: needs.frontend.result == 'success' || needs.backend-rs.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, sparse-checkout: "frontend/src\n.github/scripts"}
      - name: Download the Vitest reports
        if: needs.frontend.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {pattern: "vitest-*", path: "${{ runner.temp }}/vitest"}
      - name: Every frontend test file ran exactly once
        if: needs.frontend.result == 'success'
        run: python3 .github/scripts/vitest_coverage.py frontend/src "$RUNNER_TEMP/vitest"
      # The same proof for the backend's shards, from the output of each leg.
      - name: Download the backend test outputs
        if: needs.backend-rs.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {pattern: "backend-rs-*", path: "${{ runner.temp }}/backend-rs"}
      - name: Every backend integration test ran exactly once on each engine
        if: needs.backend-rs.result == 'success'
        run: python3 .github/scripts/backend_shards.py check "$RUNNER_TEMP/backend-rs" postgres=3 sqlite=2

  # Images are only published after every release-blocking CI job is green, and
  # only on a push to main or a version tag — not on pull requests or release branches.
  docker:
    needs: [ci-ok, release-deployment, docker-compose, backend-rs, frontend, e2e, sidecar-base, sidecar, native-sidecars, compose-sidecar-build, workflow-inventory]
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/release/')
    uses: ./.github/workflows/docker.yml
    secrets: inherit
    permissions: {contents: read, packages: write}
