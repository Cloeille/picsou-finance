name: CI

on:
  pull_request:
  push:
    branches: [main, 'release/**']
    tags: ['[0-9]*', 'v[0-9]*']

permissions: {contents: read}

# A new push to a pull request cancels its stale run. Every other run gets its own
# group: a shared group would still replace a queued main push with the next one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Selects the jobs a pull request can affect. Pushes, tags and pull requests too
  # large for the files API (3000 files) skip the filter, which selects every job.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read, pull-requests: read}
    outputs:
      # The jobs to run, as a JSON list; `all` is 'true' when the filter did not run.
      all: ${{ steps.filter.outcome == 'skipped' }}
      jobs: ${{ steps.sidecars.outputs.jobs }}
      sidecar-matrix: ${{ steps.sidecars.outputs.matrix }}
      # The timings cache every backend shard restores; '' when there is none yet.
      backend-timings-key: ${{ steps.backend-timings.outputs.cache-matched-key }}
      # The release smoke case ids, one release-deployment leg each.
      release-cases: ${{ steps.release.outputs.release-cases }}
    steps:
      # &name defines a step that later jobs reuse as *name.
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request' && github.event.pull_request.changed_files < 3000
        with:
          list-files: json
          # backend reads services/sofidy-auth (Java/Python contract), services/base
          # (its interpreter's pins).
          filters: |
            workflows: &workflows ['.github/**', 'Makefile']
            # Not a job: a change to the dependencies the release image downloads
            # makes the release smoke build refresh its cache.
            release-deps: ['backend/pom.xml', 'frontend/package.json', 'frontend/bun.lock']
            release-deployment: [*workflows, 'backend/**', 'frontend/**', 'docker/**', '.dockerignore']
            docker-compose: [*workflows, 'docker/**']
            backend: [*workflows, 'backend/**', 'services/base/**', 'services/sofidy-auth/**']
            frontend: [*workflows, 'frontend/**']
            # The entrypoint tests read each Camoufox sidecar's runtime parameters.
            sidecar-base: [*workflows, 'services/base/**', 'services/*-auth/Dockerfile']
            # A change under .github or services/base selects every sidecar,
            # one under services/<name>-auth only that one (sidecars.py --select).
            sidecar: [*workflows, 'services/base/**', 'services/*-auth/**']
            compose-sidecar-build: [*workflows, 'services/**', 'docker/docker-compose.yml']
            workflow-inventory: [*workflows, 'services/**', 'backend/src/main/resources/application*.yml', '.env.example',
                                 'docker/.env.example', 'docker/docker-compose.yml', 'docker/Dockerfile']
            helm-chart: [*workflows, 'charts/**', 'backend/src/main/resources/application.yml', 'docker/docker-compose.yml']
            e2e: [*workflows, 'frontend/**']
      - name: Select the jobs and the sidecar matrix
        id: sidecars
        env:
          # Over 1000 paths, every sidecar runs: the list stays under the 128 KiB env limit.
          ALL: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.sidecar_count >= 1000 }}
          CHANGES: ${{ steps.filter.outputs.changes }}
          FILES: ${{ steps.filter.outputs.sidecar_count < 1000 && steps.filter.outputs.sidecar_files || '[]' }}
        run: python3 .github/scripts/sidecars.py --select
      # Looked up once here, not per shard: a main ci-ok saving newer timings between two
      # shards' restores would split them differently. A re-run keeps this output, so its
      # shards split as the first attempt did.
      - name: Find the backend class timings
        id: backend-timings
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: {path: '${{ runner.temp }}/backend-timings.json', key: 'backend-timings-${{ github.run_id }}', restore-keys: backend-timings-}
      - name: List the release smoke cases
        id: release
        run: python3 .github/scripts/release_cases.py >> "$GITHUB_OUTPUT"
  release-deployment:
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.jobs), 'release-deployment')
    name: release-deployment (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `unit` runs the script checks; every other leg builds the image and runs one case.
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.changes.outputs.release-cases) }}
        include: [{task: unit}]
    steps:
      - *checkout
      - &python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - name: Check and lint the deployment shell script
        if: matrix.task == 'unit'
        run: bash -n docker/deploy.sh && shellcheck -x docker/deploy.sh
      - name: Test preflight ordering, failure isolation, and API readiness
        if: matrix.task == 'unit'
        run: python3 -m pip install pytest && python3 -m pytest docker/tests/test_deploy.py -v
      # The legs come from changes.outputs.release-cases: a case pytest collects but no
      # leg runs would never be tested.
      - name: Every collected smoke case has its own leg
        if: matrix.task == 'unit'
        env: {CASES: '${{ needs.changes.outputs.release-cases }}'}
        run: |
          ids=$(python3 -m pytest --collect-only -q docker/tests/test_deploy_integration.py \
            | tee /dev/stderr | sed -n 's/.*\[\(.*\)\]$/\1/p' | jq -Rnc '[inputs]')
          [ "$ids" = "$(jq -c . <<< "$CASES")" ] || { echo "::error::collected $ids, legs $CASES"; exit 1; }
      # The case pulls these images; fetching them during the build saves the wait.
      - name: Pull the PostgreSQL and Caddy images in the background
        if: matrix.task != 'unit'
        run: grep -oE '(postgres|caddy):[^ ]+' docker/docker-compose.yml | sort -u | xargs -P 0 -n 1 docker pull --quiet > /dev/null &
      - name: Set up Docker Buildx
        if: matrix.task != 'unit'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # A cold build downloads every Maven and bun dependency, and Maven Central answers
      # shared runner IPs with 429 Too Many Requests. Reusing the layers of the release
      # build (docker.yml, scope `app`) and of earlier smoke builds keeps registries out
      # of the run unless backend/pom.xml, frontend/package.json or frontend/bun.lock
      # changed, or the cached layers are missing (evicted or cache unavailable).
      # mode=max is required: the dependency layers live in the build stages, not the
      # final image. ignore-error keeps a cache export failure from failing the job.
      # Only the http leg exports, and on a pull request only when those files changed:
      # the export costs 20-60 s and a pull request's cache is invisible to main.
      - name: Build the real release image for migration smoke tests
        if: matrix.task != 'unit'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          tags: picsou-release-smoke:test
          load: true
          cache-from: |
            type=gha,scope=release-smoke
            type=gha,scope=app
          cache-to: >-
            ${{ matrix.task == 'http' && (github.event_name == 'push'
            || contains(fromJSON(needs.changes.outputs.jobs), 'release-deps'))
            && 'type=gha,mode=max,scope=release-smoke,ignore-error=true' || '' }}
      # A skipped case reports green: require the one selected case to pass.
      - name: Exercise packaged CLI, repeat deployment, and incompatible-schema isolation
        if: matrix.task != 'unit'
        env: {PICSOU_RELEASE_TEST_IMAGE: 'picsou-release-smoke:test', CASE: '${{ matrix.task }}'}
        # pipefail: without it tee would hide pytest's exit code (an error after the pass).
        run: |
          set -o pipefail
          python3 -m pip install pytest
          python3 -m pytest -v -s \
            "docker/tests/test_deploy_integration.py::test_packaged_release_migrates_repeats_and_preserves_api_on_bad_schema[$CASE]" \
            | tee case.txt
          grep -q ' 1 passed' case.txt

  docker-compose:
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.jobs), 'docker-compose')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - *checkout
      - *python
      - name: Test the Compose password and data-permissions wiring
        run: python -m unittest discover -s docker/tests -p 'test_compose.py' -v
      - name: Test the Compose trusted proxy addresses
        run: |
          docker info > /dev/null
          python3 -m pip install pytest
          python3 -m pytest docker/tests/test_proxy_client_ip.py -v

  # The suite in shards of test classes, balanced by the last main run's class times
  # (.github/scripts/backend_shards.py). ci-ok checks every class ran exactly once.
  # One job key with a matrix: ci-ok reads a skipped `backend` as skipped, whatever its legs.
  backend:
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.jobs), 'backend')
    name: backend (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - *checkout
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: {distribution: temurin, java-version: '21', cache: maven}
      - *python
      - name: Install the Sofidy contract interpreter
        run: pip install -r services/base/requirements.txt
      # The exact cache `changes` found, so every shard splits on the same timings. ci-ok
      # saves them on main pushes. None (or evicted since) splits by hash: slower, still complete.
      - name: Restore the backend class timings
        if: needs.changes.outputs.backend-timings-key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: {path: '${{ runner.temp }}/backend-timings.json', key: '${{ needs.changes.outputs.backend-timings-key }}'}
      - name: Select this shard's test classes
        id: shard
        run: >-
          python3 .github/scripts/backend_shards.py --shards ${{ strategy.job-total }} --shard ${{ matrix.shard }}
          --timings "$RUNNER_TEMP/backend-timings.json" --out "$RUNNER_TEMP"
      - name: Run backend tests
        # Migration tests skip themselves when Docker is unreachable so local runs
        # without a socket still work. Runners always have Docker, so require it here --
        # otherwise environment drift would silently drop the PostgreSQL coverage of
        # data-mutating migrations and the build would stay green.
        env:
          PICSOU_REQUIRE_DOCKER_TESTS: 'true'
          SHARD_INCLUDES: ${{ steps.shard.outputs.includes }}
          SHARD_EXCLUDES: ${{ steps.shard.outputs.excludes }}
        run: make test-backend SOFIDY_PYTHON=python3
      # A re-run of a failed shard uploads under the same name as its first attempt, which
      # stays in the run: overwrite it, or the upload fails with a 409 conflict.
      - name: Upload the test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-${{ matrix.shard }}
          overwrite: true
          path: |
            backend/target/surefire-reports/*.xml
            backend/target/surefire-reports/*.txt
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: frontend (${{ matrix.task }})
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.jobs), 'frontend')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: [{task: lint}, {task: test-1, shard: 1, total: 2}, {task: test-2, shard: 2, total: 2}]
    steps:
      - *checkout
      - &bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - &bun-cache
        name: Cache bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: {path: ~/.bun/install/cache, key: "bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}"}
      - &bun-install
        name: Install
        run: make deps
      - name: Lint and typecheck
        if: matrix.task == 'lint'
        run: make lint-frontend
      - name: Unit tests (shard ${{ matrix.shard }}/${{ matrix.total }})
        if: matrix.task != 'lint'
        run: make unit-frontend SHARD=${{ matrix.shard }}/${{ matrix.total }} VITEST_JSON=${{ runner.temp }}/vitest-${{ matrix.task }}.json
      - name: Upload the Vitest report
        if: matrix.task != 'lint'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: "vitest-${{ matrix.task }}", path: "${{ runner.temp }}/vitest-${{ matrix.task }}.json", if-no-files-found: error, retention-days: 7}

  # services/base tests. The Camoufox target inherits the python one, so it runs them all.
  sidecar-base:
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.jobs), 'sidecar-base')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *checkout
      - name: Run the shared package, installer and entrypoint tests in the Camoufox base
        run: make test-sidecar-base

  # One job per services/*-auth folder (.github/scripts/sidecars.py), plus a native
  # ARM64 one for Camoufox sidecars. Each sidecar keeps its tests as test_*.py stdlib
  # unittest modules next to main.py; `make test-sidecar` builds the image and runs them.
  sidecar:
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.jobs), 'sidecar')
    name: sidecar (${{ matrix.service }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.sidecar-matrix) }}
    steps:
      - *checkout
      # Builds the shared base, then the image; checks it runs main.py non-root on its
      # base (Camoufox ones also start the browser offline), then runs the tests in it.
      - name: Build and test the ${{ matrix.service }} image
        run: make test-sidecar SIDECAR=${{ matrix.service }} ARCH=${{ matrix.arch }}

  compose-sidecar-build:
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.jobs), 'compose-sidecar-build')
    # The Compose wiring (build-only bases, `additional_contexts: service:`)
    # as users run it, not only as YAML assertions.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: {APP_SIDECAR_API_KEY: ci-test-only}
    steps:
      - *checkout
      - name: Resolve the published Compose file and build one sidecar per base through it
        run: |
          docker compose version
          docker compose -f docker/docker-compose.yml config --quiet
          make build SERVICES="tr-auth bourso-auth amex-auth"
      - name: The sidecars run on their base
        run: >-
          docker compose -f docker/docker-compose.yml run --rm --no-deps
          --entrypoint python tr-auth
          -c "import os, playwright; assert os.environ['PLAYWRIGHT_BROWSERS_PATH'] == '/opt/playwright-browsers'"
      - name: Tear down without a profile
        run: docker compose -f docker/docker-compose.yml down --volumes --remove-orphans

  workflow-inventory:
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.jobs), 'workflow-inventory')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - *checkout
      - *python
      - name: Check sidecar workflow inventory
        run: |
          python -m pip install PyYAML==6.0.3
          python -m unittest discover -s .github/tests -v

  # A sidecar missing from the chart is a warning, never a failure: publishing adds
  # the standard ones (docker.yml, chart job) and the chart maintainer follows up
  # on the others. A chart that does not lint or render fails.
  helm-chart:
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.jobs), 'helm-chart')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - *checkout
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with: {version: v4.3.1}
      - name: Lint the chart
        run: helm lint --strict charts/picsou
      - name: Render the default and the optional resources
        run: |
          helm template picsou charts/picsou > /dev/null
          helm template picsou charts/picsou \
            --set ingress.enabled=true \
            --set httpRoute.enabled=true --set 'httpRoute.parentRefs[0].name=gateway' \
            --set postgresql.enabled=false --set externalDatabase.host=db \
            --set secrets.existingSecret=picsou --set app.enableBanking.existingSecret=eb \
            --set 'networkPolicy.appIngressFrom[0].podSelector.matchLabels.app=ingress' > /dev/null
      - name: Test chart storage and upgrade safety
        run: python3 -m unittest discover -s charts/picsou/tests -v
      - name: Compare the chart's sidecars with the Compose file
        run: |
          status=0
          charts/picsou/sync-sidecars.sh --check --github || status=$?
          # 2 means differences, already reported as warnings.
          [ "$status" -eq 0 ] || [ "$status" -eq 2 ]

  e2e:
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.jobs), 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout
      - *bun
      - *bun-cache
      - *bun-install
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: {path: ~/.cache/ms-playwright, key: "playwright-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}"}
      - name: Install Playwright Chromium
        run: cd frontend && bunx playwright install chromium
      - name: Probe a headless Chromium launch
        id: chromium-probe
        continue-on-error: true
        timeout-minutes: 3
        working-directory: frontend
        # Node, as the Playwright CLI runs under it (its shebang), not bun's runtime.
        run: node -e "require('@playwright/test').chromium.launch().then((browser) => browser.close())"
      - name: Install Chromium system libraries (fallback)
        if: steps.chromium-probe.outcome == 'failure'
        timeout-minutes: 12
        run: |
          echo "::notice title=e2e-deps-fallback::Chromium could not start; installing its system libraries"
          cd frontend && bunx playwright install-deps chromium
      - name: Run E2E (demo mode)
        run: make test-e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: playwright-report, path: frontend/playwright-report/, retention-days: 7}

  # Green only when every release-blocking job the change selected passed and no
  # such job failed or was cancelled. Helm validation remains an independent check:
  # chart failures must not prevent application images from being published.
  ci-ok:
    if: always()
    needs: [changes, release-deployment, docker-compose, backend, frontend, e2e, sidecar-base, sidecar, compose-sidecar-build, workflow-inventory]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every selected job succeeded
        env: {NEEDS: '${{ toJSON(needs) }}'}
        run: |
          jq -en --argjson needs "$NEEDS" '
            $needs.changes.outputs as $out
            | [$needs | to_entries[] | .key as $job
                | select(.value.result != "success" and (.value.result != "skipped"
                    or $out.all == "true" or ($out.jobs // "" | if . == "" then "[]" else . end | fromjson | index($job)) != null))
                | "\(.key): \(.value.result)"]
            | if . == [] then true else error("not green: \(join(", "))") end'
      # A green matrix only proves each shard passed what it selected: check the reports
      # cover every test file. One checkout of just the test sources and the scripts serves both.
      - name: Check out the test sources
        if: needs.backend.result == 'success' || needs.frontend.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, sparse-checkout: "backend/src/test/java\nfrontend/src\n.github/scripts"}
      # One folder per shard: a merged download would hide a class that ran twice. Outside
      # the workspace, so a later checkout's clean cannot delete the reports.
      - name: Download the backend test reports
        if: needs.backend.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {pattern: surefire-*, path: '${{ runner.temp }}/surefire'}
      - name: Require every backend test class to run exactly once
        if: needs.backend.result == 'success'
        run: python3 .github/scripts/backend_shards.py --check "$RUNNER_TEMP/surefire"
      # A skipped PostgreSQL test class reports green: require each one ran, with nothing skipped.
      # No per-class count: Skipped: 0 already catches a skip, and a count breaks on every new test or bank.
      - name: Require the PostgreSQL tests
        if: needs.backend.result == 'success'
        working-directory: ${{ runner.temp }}/surefire
        run: |
          while read -r class; do
            grep -qE "Tests run: [1-9][0-9]*, Failures: 0, Errors: 0, Skipped: 0," ./*/"com.picsou.$class.txt" \
              || { echo "::error::$class did not run in full"; cat ./*/"com.picsou.$class.txt"; exit 1; }
          done <<'EOF'
          service.ScpiSyncSessionPostgresTest
          service.HomeBankImportPersistenceTest
          service.HomeBankQifPersistenceTest
          migration.LegacyMigrationRenumberingTest
          service.SidecarBudgetPostgresTest
          service.SetupAuditServicePostgresTest
          config.SsoLoginIntegrationTest
          config.SsoHandshakeSessionRaceIntegrationTest
          adapter.sidecar.SidecarBankCodesTest
          service.PeerLoanTransactionLinksPostgresTest
          migration.V142SidecarSessionMigrationTest
          migration.V146NatixisSidecarSessionMigrationTest
          migration.V149TradeRepublicSidecarSessionMigrationTest
          migration.V150BnpSidecarSessionMigrationTest
          migration.FutureMigrationStartupTest
          EOF
      # The next runs balance their shards on these class times.
      - name: Collect the backend class timings
        if: github.event_name == 'push' && needs.backend.result == 'success'
        run: python3 .github/scripts/backend_shards.py --write-timings "$RUNNER_TEMP/surefire" "$RUNNER_TEMP/backend-timings.json"
      # The same path as the restores: the cache version depends on it.
      - name: Save the backend class timings
        if: github.event_name == 'push' && needs.backend.result == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: {path: '${{ runner.temp }}/backend-timings.json', key: 'backend-timings-${{ github.run_id }}'}
      - name: Download the Vitest reports
        if: needs.frontend.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {pattern: "vitest-*", path: "${{ runner.temp }}/vitest"}
      - name: Every frontend test file ran exactly once
        if: needs.frontend.result == 'success'
        run: python3 .github/scripts/vitest_coverage.py frontend/src "$RUNNER_TEMP/vitest"

  # Images are only published after every release-blocking CI job is green, and
  # only on a push to main or a version tag — not on pull requests or release branches.
  docker:
    needs: [ci-ok, release-deployment, docker-compose, backend, frontend, e2e, sidecar-base, sidecar, compose-sidecar-build, workflow-inventory]
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/release/')
    uses: ./.github/workflows/docker.yml
    secrets: inherit
    permissions: {contents: read, packages: write}
