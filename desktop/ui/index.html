<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Picsou</title>
    <style>
      body { margin: 0; height: 100vh; display: grid; place-items: center; font: 15px system-ui, sans-serif; background: #0f1115; color: #e6e6e6; }
      main { max-width: 32rem; text-align: center; }
      #error { display: none; color: #ff8a80; white-space: pre-wrap; }
      body.failed #error { display: block; }
      body.failed #waiting { display: none; }
      button { display: none; margin-top: 1rem; padding: .5rem 1rem; font: inherit; }
      body.restorable button { display: inline-block; }
    </style>
  </head>
  <body>
    <main>
      <h1>Picsou</h1>
      <p id="waiting">Starting Picsou. The first start prepares the database and takes up to a minute.</p>
      <p id="error"></p>
      <button id="restore" type="button">Restore my data from before the update</button>
    </main>
    <script>
      const error = document.getElementById("error");
      const restore = document.getElementById("restore");
      window.picsouFailed = (message, canRestore) => {
        error.textContent = "Picsou could not start.\n" + message;
        document.body.classList.add("failed");
        document.body.classList.toggle("restorable", Boolean(canRestore));
      };
      restore.addEventListener("click", async () => {
        restore.disabled = true;
        error.textContent = "Restoring your data. This can take a minute; keep Picsou open.";
        try {
          error.textContent = await window.__TAURI__.core.invoke("restore_backup");
          document.body.classList.remove("restorable");
        } catch (failure) {
          error.textContent = "The restore did not complete: " + failure;
          restore.disabled = false;
        }
      });
    </script>
  </body>
</html>
