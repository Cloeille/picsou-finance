[package]
name = "picsou-desktop"
version = "1.1.0"
description = "Picsou as a desktop app: the Docker release's backend and PostgreSQL, run locally"
license = "MIT"
edition = "2021"
rust-version = "1.85"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.14"
serde_json = "1"
getrandom = "0.4"
semver = "1"
dunce = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
