[package]
name = "picsou-desktop"
version = "1.2.2"
description = "Picsou as a desktop app: embedded Rust backend and SQLite database, run locally"
license = "MIT"
edition = "2021"
rust-version = "1.94"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.14"
axum = "0.8"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
regex = "1.13.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "cookies"] }
rust_decimal = { version = "1.43.0", features = ["serde-arbitrary-precision"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
sha2 = "0.11.1"
subtle = "2.6.1"
url = "2.5.9"
uuid = { version = "1.29.3", features = ["v4"] }
getrandom = "0.4"
semver = "1"
dunce = "1"
open = "5"
sys-locale = "0.3"
picsou = { version = "0.1.0", path = "../../backend-rs" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time"] }
anyhow = "1.0.104"
tracing = "0.1.44"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
