[package]
name = "picsou-desktop"
version = "1.1.0"
description = "Picsou as a desktop app: the Docker release's backend and PostgreSQL, run locally"
license = "MIT"
edition = "2021"
rust-version = "1.85"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde_json = "1"
getrandom = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
