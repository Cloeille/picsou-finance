{{- if .Values.postgresql.enabled }}
{{- $pg := .Values.postgresql }}
{{- $name := include "picsou.postgresql.fullname" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "picsou.componentLabels" (dict "ctx" $ "component" "postgresql") | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ $name }}
  selector:
    matchLabels:
      {{- include "picsou.selectorLabels" (dict "ctx" $ "component" "postgresql") | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "picsou.secretChecksum" . | nindent 8 }}
      labels:
        {{- include "picsou.selectorLabels" (dict "ctx" $ "component" "postgresql") | nindent 8 }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- with $pg.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgresql
          image: {{ printf "%s:%s" $pg.image.repository (toString $pg.image.tag) }}
          imagePullPolicy: {{ include "picsou.pullPolicy" (dict "ctx" $ "image" $pg.image) }}
          {{- with $pg.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: {{ $pg.database | quote }}
            - name: POSTGRES_USER
              value: {{ $pg.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "picsou.secretName" . }}
                  key: postgres-password
            # A subdirectory, so initdb does not trip over lost+found at the
            # root of a freshly formatted volume.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # Crash recovery after an unclean stop can outlast the liveness window
          # (30s initial delay, 5 failures every 30s); liveness only starts once
          # this succeeds, for up to 10 minutes.
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          {{- with $pg.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          {{- if $pg.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $pg.persistence.existingClaim | default (printf "%s-data" $name) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with $pg.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "picsou.componentLabels" (dict "ctx" $ "component" "postgresql") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
  selector:
    {{- include "picsou.selectorLabels" (dict "ctx" $ "component" "postgresql") | nindent 4 }}
{{- end }}
