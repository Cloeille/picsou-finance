{{- $secret := include "picsou.secretName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "picsou.fullname" . }}
  labels:
    {{- include "picsou.componentLabels" (dict "ctx" $ "component" "app") | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  # Flyway migrations and the ReadWriteOnce /data volume rule out two app
  # versions running at the same time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "picsou.selectorLabels" (dict "ctx" $ "component" "app") | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "picsou.secretChecksum" . | nindent 8 }}
        {{- with .Values.app.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "picsou.selectorLabels" (dict "ctx" $ "component" "app") | nindent 8 }}
        {{- with .Values.app.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- with .Values.app.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: {{ include "picsou.image" (dict "ctx" $ "image" .Values.app.image) }}
          imagePullPolicy: {{ include "picsou.pullPolicy" (dict "ctx" $ "image" .Values.app.image) }}
          {{- with .Values.app.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_DATASOURCE_URL
              value: {{ include "picsou.database.jdbcUrl" . | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ include "picsou.database.username" . | quote }}
            # The entrypoint forwards POSTGRES_PASSWORD to SPRING_DATASOURCE_PASSWORD.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "picsou.database.passwordSecret" . }}
                  key: {{ include "picsou.database.passwordKey" . }}
            - name: APP_SIDECAR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: sidecar-api-key
            # Optional: when the key is absent the entrypoint generates the value
            # on first boot and persists it under /data/.secrets.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: jwt-secret
                  optional: true
            - name: CRYPTO_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: crypto-encryption-key
                  optional: true
            {{- range $name, $sc := .Values.sidecars }}
            {{- if $sc.enabled }}
            - name: {{ $sc.urlEnv }}
              value: {{ printf "http://%s:%v" (include "picsou.sidecarName" (dict "ctx" $ "name" $name)) $sc.port | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.app.enableBanking.existingSecret }}
            - name: ENABLEBANKING_PRIVATE_KEY_PATH
              value: /run/secrets/enablebanking/{{ $.Values.app.enableBanking.key }}
            {{- end }}
            {{- range $k, $v := .Values.app.env }}
            - name: {{ $k }}
              value: {{ toString $v | quote }}
            {{- end }}
            {{- with .Values.app.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.app.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.app.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.app.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.app.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.app.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.app.enableBanking.existingSecret }}
            - name: enablebanking
              mountPath: /run/secrets/enablebanking
              readOnly: true
            {{- end }}
            {{- with .Values.app.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.app.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.app.persistence.existingClaim | default (printf "%s-data" (include "picsou.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with .Values.app.enableBanking.existingSecret }}
        - name: enablebanking
          secret:
            secretName: {{ . }}
            defaultMode: 0400
            items:
              - key: {{ $.Values.app.enableBanking.key }}
                path: {{ $.Values.app.enableBanking.key }}
        {{- end }}
        {{- with .Values.app.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
