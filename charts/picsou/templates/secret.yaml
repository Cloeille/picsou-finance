{{- if not .Values.secrets.existingSecret }}
{{- $name := include "picsou.fullname" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $s := .Values.secrets }}
{{- /* An initialized bundled database keeps the password it was created with. */}}
{{- $storedPg := index $existing "postgres-password" }}
{{- if and .Values.postgresql.enabled $storedPg $s.postgresPassword }}
{{- if ne ($s.postgresPassword | b64enc) $storedPg }}
{{- fail "secrets.postgresPassword differs from the stored postgres-password, but the bundled PostgreSQL keeps the password it was created with. Change it with ALTER ROLE inside the PostgreSQL pod, update postgres-password in the Secret, then set secrets.postgresPassword to the new value (or leave it empty)." }}
{{- end }}
{{- end }}
{{- /* Explicit value, else the value already stored in the cluster, else a new one. */}}
{{- $sidecarKey := $s.sidecarApiKey | include "picsou.secret.inlineValue" | b64enc | default (index $existing "sidecar-api-key") | default (randBytes 32 | b64enc) }}
{{- $pgPassword := $s.postgresPassword | include "picsou.secret.inlineValue" | b64enc | default (index $existing "postgres-password") | default (randAlphaNum 32 | b64enc) }}
{{- if and .Values.postgresql.enabled (index $existing "postgres-password") (ne $pgPassword (index $existing "postgres-password")) }}
{{- fail "bundled PostgreSQL password differs from the stored Secret: first ALTER ROLE with the new password, then update the Secret, then set secrets.postgresPassword to the same value (see chart README)" }}
{{- end }}
{{- $jwt := $s.jwtSecret | include "picsou.secret.inlineValue" | b64enc | default (index $existing "jwt-secret") }}
{{- $crypto := $s.cryptoEncryptionKey | include "picsou.secret.inlineValue" | b64enc | default (index $existing "crypto-encryption-key") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "picsou.labels" . | nindent 4 }}
  annotations:
    # Never delete on uninstall: the PostgreSQL password and the encryption key
    # must survive a reinstall on the same volumes.
    helm.sh/resource-policy: keep
type: Opaque
data:
  sidecar-api-key: {{ $sidecarKey }}
  postgres-password: {{ $pgPassword }}
  {{- with $jwt }}
  jwt-secret: {{ . }}
  {{- end }}
  {{- with $crypto }}
  crypto-encryption-key: {{ . }}
  {{- end }}
{{- end }}
