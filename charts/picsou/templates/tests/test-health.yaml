apiVersion: v1
kind: Pod
metadata:
  name: {{ include "picsou.fullname" . }}-test-health
  labels:
    {{- include "picsou.componentLabels" (dict "ctx" $ "component" "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: health
      image: busybox:1.37
      command:
        - wget
        - -q
        - -O-
        - http://{{ include "picsou.fullname" . }}:{{ .Values.app.service.port }}/actuator/health
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop:
            - ALL
