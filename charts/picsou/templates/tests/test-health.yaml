apiVersion: v1
kind: Pod
metadata:
  name: {{ include "picsou.fullname" . }}-test-health
  labels:
    {{- include "picsou.componentLabels" (dict "ctx" $ "component" "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with .Values.global.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: health
      image: {{ include "picsou.image" (dict "ctx" $ "image" .Values.tests.image) }}
      imagePullPolicy: {{ include "picsou.pullPolicy" (dict "ctx" $ "image" .Values.tests.image) }}
      command:
        - wget
        - -q
        - -O-
        - http://{{ include "picsou.fullname" . }}:{{ .Values.app.service.port }}/actuator/health
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop:
            - ALL
  {{- with .Values.app.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.app.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.app.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
