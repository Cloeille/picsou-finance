spring:
  application:
    name: picsou

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/picsou}
    username: ${SPRING_DATASOURCE_USERNAME:picsou}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:picsou}}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # Allow migrations to apply even if a lower version number lands later
    # (branches are numbered independently, e.g. this feature's V50 may deploy
    # before the 1.1.0 branch's V33-V47). Without this, validate-on-migrate
    # rejects the out-of-order migrations and the app fails to start.
    out-of-order: true
    # Spring Boot defaults this to ["*:future"], which turns an applied version this image does
    # not ship into a warning. An older image on a newer database must fail here, naming the
    # missing version, not later in Hibernate with a missing table.
    ignore-migration-patterns: []

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  servlet:
    multipart:
      # 10MB accommodates multi-year CSV transaction histories; the import endpoint is
      # member-scoped and IP-throttled, so this does not widen the abuse surface.
      max-file-size: 10MB
      max-request-size: 10MB

  # FormContentFilter runs before Spring Security and reads a whole form-encoded PUT/PATCH/DELETE
  # body into memory, with no limit, on every path AnonymousBodyLimitFilter does not cap. No
  # endpoint reads a form-encoded PUT/PATCH/DELETE body (the integration toggle takes `enabled`
  # from the query string), so it is off.
  mvc:
    formcontent:
      filter:
        enabled: false

  # MCP_PROTOCOL=STREAMABLE enables protocol 2025-11-25 for hosted connectors. SSE remains the
  # default for existing clients. Both transports stay under /mcp/** for access-key/OAuth scoping.
  ai:
    mcp:
      server:
        enabled: ${MCP_ENABLED:true}
        stdio: false
        type: SYNC
        name: picsou
        version: ${APP_VERSION:dev}
        instructions: >-
          Picsou personal-finance MCP server. Every tool operates only on the financial data of
          the member who owns the access-key used to authenticate: it can never read or modify
          another member's data, and it cannot perform authentication, credential, admin,
          member-management, MFA, or data-export operations. Monetary values are in each account's
          own currency unless the field name ends in "Eur".
        sse-endpoint: /mcp
        sse-message-endpoint: /mcp/message
        request-timeout: 30s
        protocol: ${MCP_PROTOCOL:SSE}
        streamable-http:
          mcp-endpoint: /mcp
          keep-alive-interval: ${MCP_KEEP_ALIVE_INTERVAL:60s}
        # The server pings every open SSE session at this interval. Without it the stream stays
        # silent between two replies, and clients drop it as idle: Bun's fetch (Claude Code) after
        # ~6 min, the Python MCP SDK's SSE client after 300 s. The next call then times out.
        keep-alive-interval: ${MCP_KEEP_ALIVE_INTERVAL:60s}
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false

    # AI transaction categorization: provider/key/model are RUNTIME config (Admin → Settings,
    # stored in app_setting). spring.ai.model.* stays "none" so the starters never auto-build a
    # ChatModel at boot — AiChatModelFactory constructs the selected provider's model on demand.
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        transcription: none
        speech: none

server:
  port: 8080
  # Tomcat is the edge of the container. It takes the client address (X-Forwarded-For) only from
  # PICSOU_PROXY_IP, or from an explicit server.tomcat.remoteip.internal-proxies (see
  # TrustedProxyBootstrap); with neither it trusts nobody, not Tomcat's private-network default.
  # The public origin (X-Forwarded-Proto/Host/Port) is applied from any peer by
  # ForwardedOriginCustomizer, as the bundled nginx did.
  # All rate limiters and audit readers share this container-resolved remote address.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      host-header: X-Forwarded-Host
      port-header: X-Forwarded-Port
  error:
    include-stacktrace: never     # never expose stack traces to clients
    include-message: never
  compression:
    enabled: true
    # The bundled nginx used to compress; Spring does now. Same types and threshold, so SVG and
    # images stay uncompressed.
    mime-types: text/html,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 20B

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      # /actuator/health/liveness and /readiness for the Helm probes. Once started, liveness
      # ignores the database, so an outage does not restart the pod.
      probes:
        enabled: true
  info:
    # Expose `info.*` properties (below) via /actuator/info. The env info
    # contributor is disabled by default since Spring Boot 2.6, so without this
    # the app.version block would never surface.
    env:
      enabled: true

info:
  app:
    name: picsou
    version: ${APP_VERSION:dev}

app:
  # Civil time zone for the whole application: every LocalDate.now() / LocalDateTime.now(), the
  # snapshot dates connectors write, goal deadlines, and the keys both price adapters give their
  # intraday and daily series. TimeZoneConfig pins the JVM default from this value at startup, so
  # it is the only place the zone is chosen — nothing else needs to know it.
  #
  # Changing it also changes what "today" means for snapshots already stored under the old zone;
  # set it once, before the first sync. An unknown zone ID fails startup rather than falling back.
  # In Docker, keep the image's TZ / -Duser.timezone in step with it (see docker/Dockerfile).
  timezone: ${APP_TIMEZONE:Europe/Paris}

  # Property valuation from French open data. No credentials of any kind: every source
  # below is Licence Ouverte 2.0 and unauthenticated, which is what lets a self-hosted
  # instance estimate property value without a per-user API subscription.
  valuation:
    enabled: ${VALUATION_ENABLED:true}
    cerema:
      # DVF market indicators (median €/m² per commune), from DGFiP transaction data.
      base-url: ${CEREMA_API_URL:https://apidf-preprod.cerema.fr}
    insee:
      # Housing price index, used to carry a DVF vintage forward to today.
      base-url: ${INSEE_API_URL:https://api.insee.fr/series/BDM/V1}
  geocoding:
    # IGN Géoplateforme. Not api-adresse.data.gouv.fr: that host was decommissioned at the
    # end of January 2026 and now only survives as a cross-host redirect.
    base-url: ${GEOCODING_API_URL:https://data.geopf.fr/geocodage}
  admin-recovery:
    enabled: ${ADMIN_RECOVERY_ENABLED:false}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  # Opt-in anonymous telemetry (GlitchTip / Sentry protocol). An empty DSN keeps the feature fully
  # inactive: no SDK, no consent prompt, the browser tunnel drops everything. Even with a DSN,
  # nothing is sent until the instance admin consents. See docs/features/telemetry.md.
  telemetry:
    dsn: ${APP_TELEMETRY_DSN:}
    environment: ${APP_TELEMETRY_ENVIRONMENT:production}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7
  # OAuth2 authorization server — the native iOS app's public client (Authorization Code + PKCE).
  # Tokens are HS256-signed with app.jwt.secret above, so no separate signing key is needed.
  oauth:
    client-id: ${OAUTH_IOS_CLIENT_ID:picsou-ios}
    redirect-uri: ${OAUTH_IOS_REDIRECT_URI:picsou://callback}
    access-token-ttl-minutes: ${OAUTH_ACCESS_TTL_MINUTES:15}
    refresh-token-ttl-days: ${OAUTH_REFRESH_TTL_DAYS:30}
  # OIDC single sign-on (optional). On only when issuer-uri and client-id are both set; invalid
  # values log an ERROR and disable SSO, never fail startup. See docs/briefs/2026-10-31-sso-login-design.md.
  sso:
    issuer-uri: ${SSO_ISSUER_URI:}
    client-id: ${SSO_CLIENT_ID:}
    client-secret: ${SSO_CLIENT_SECRET:}
    provider-name: ${SSO_PROVIDER_NAME:SSO}
    scopes: ${SSO_SCOPES:openid,profile,email}
    groups-claim: ${SSO_GROUPS_CLAIM:groups}
    admin-group: ${SSO_ADMIN_GROUP:}
    session-revalidate-after: ${SSO_SESSION_REVALIDATE_AFTER:24h}
    idp-logout: ${SSO_IDP_LOGOUT:false}
  user:
    username: ${APP_USERNAME:}
    password-hash: ${APP_PASSWORD_HASH:}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:}
  secure-cookies: ${SECURE_COOKIES:true}
  # Strict-Transport-Security. Off by default; one flag controls the header on every response
  # (SPA, /api and the OAuth2 endpoints). Enable only behind a
  # publicly-trusted certificate — see docs/features/docker-deployment.md.
  hsts-enabled: ${HSTS_ENABLED:false}
  spa:
    # Directory holding the built React app (index.html and assets). The Docker image sets it to
    # /app/spa. Blank (the default) serves nothing: development uses the Vite dev server.
    location: ${SPA_LOCATION:}
  crypto:
    encryption-key: ${CRYPTO_ENCRYPTION_KEY:}
  # One entry per connector sidecar, keyed by its compose service name. This is the only
  # place the URLs are defined; SidecarProperties fails startup if a consumer asks for a missing one.
  sidecars:
    tr-auth:
      url: ${TR_AUTH_URL:http://tr-auth:8001}
    bourso-auth:
      url: ${BOURSO_AUTH_URL:http://bourso-auth:8001}
    caisse-epargne-auth:
      url: ${CAISSE_EPARGNE_AUTH_URL:http://caisse-epargne-auth:8001}
    banque-populaire-auth:
      url: ${BANQUE_POPULAIRE_AUTH_URL:http://banque-populaire-auth:8001}
    lbp-auth:
      url: ${LBP_AUTH_URL:http://lbp-auth:8001}
    revolut-auth:
      url: ${REVOLUT_AUTH_URL:http://revolut-auth:8002}
    bourse-direct-auth:
      url: ${BOURSE_DIRECT_AUTH_URL:http://bourse-direct-auth:8001}
    degiro-auth:
      url: ${DEGIRO_AUTH_URL:http://degiro-auth:8001}
    amundi-auth:
      url: ${AMUNDI_AUTH_URL:http://amundi-auth:8001}
    cmes-auth:
      url: ${CMES_AUTH_URL:http://cmes-auth:8001}
    cic-auth:
      url: ${CIC_AUTH_URL:http://cic-auth:8001}
    natixis-auth:
      url: ${NATIXIS_AUTH_URL:http://natixis-auth:8001}
    bnp-auth:
      url: ${BNP_AUTH_URL:http://bnp-auth:8001}
    amex-auth:
      url: ${AMEX_AUTH_URL:http://amex-auth:8001}
    fortuneo-auth:
      url: ${FORTUNEO_AUTH_URL:http://fortuneo-auth:8001}
    corum-auth:
      url: ${CORUM_AUTH_URL:http://corum-auth:8001}
    sofidy-auth:
      url: ${SOFIDY_AUTH_URL:http://sofidy-auth:8001}
  # Latest GitHub release, checked at most once per 6 h when an admin opens the app.
  # APP_UPDATE_CHECK_ENABLED=false skips the call entirely.
  update-check:
    enabled: ${APP_UPDATE_CHECK_ENABLED:true}
  # Meria's public API. Overridable like every other external base URL above, which is what lets
  # an integration environment point it at a stub without editing the packaged config.
  # MeriaAdapter carries the same value as its @Value default, so a stripped config still boots.
  meria:
    base-url: ${MERIA_BASE_URL:https://api.meria.com/v1}
  startup-sync:
    enabled: ${APP_STARTUP_SYNC_ENABLED:true}
  # Share and fund logos, read once per ticker from its Yahoo Finance quote page and stored in
  # PostgreSQL (docs/features/holding-logos.md). Turning it off stops new lookups only: marks
  # already stored keep showing, and a holding without one shows its ticker alone.
  instrument-logos:
    enabled: ${INSTRUMENT_LOGOS_ENABLED:true}
  enablebanking:
    application-id: ${ENABLEBANKING_APPLICATION_ID:}
    key-id: ${ENABLEBANKING_KEY_ID:}
    redirect-uri: ${ENABLEBANKING_REDIRECT_URI:https://localhost:5173/sync/callback}
    private-key: ${ENABLEBANKING_PRIVATE_KEY:}
    private-key-path: ${ENABLEBANKING_PRIVATE_KEY_PATH:/data/keys/enablebanking-private.pem}
    base-url: ${ENABLEBANKING_BASE_URL:https://api.enablebanking.com}
